<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>doodle-crowd</title>
<style>
  html,body{margin:0;padding:0;background:#e8e2d2;height:100%;overflow:hidden}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<script>
'use strict';
/* ============================================================
 * doodle-crowd — procedural hand-drawn character animation
 * All code, no assets. Deterministic: every random value comes
 * from seeded PRNGs; every pose is a pure function of time t.
 * ============================================================ */

/* ---------- seeded RNG ---------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
class RNG {
  constructor(seed){ this.f = mulberry32(seed); }
  next(){ return this.f(); }
  range(a,b){ return a + (b-a)*this.f(); }
  int(a,b){ return Math.floor(this.range(a, b+1)); }
  pick(arr){ return arr[Math.floor(this.f()*arr.length)]; }
  chance(p){ return this.f() < p; }
}
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ---------- smooth 1D value noise (per-stroke, seeded -> stable wobble) ---------- */
function makeNoise1D(seed){
  const rng = mulberry32(seed);
  const N = 128, table = new Float32Array(N*2);
  for(let i=0;i<N;i++) table[i] = rng()*2-1;
  for(let i=0;i<N;i++) table[N+i] = table[i];
  return function(t){
    const i = Math.floor(t), f = t - i;
    const u = f*f*(3-2*f);
    return table[i%N] + (table[(i+1)%N] - table[i%N]) * u;
  };
}

/* ---------- doodle renderer ---------- */
const PENCIL = '#3d372f';

// Subdivide a polyline so wobble is visible along segments.
function subdivide(pts, step){
  if(pts.length < 2) return pts.slice();
  const out = [pts[0].slice()];
  for(let i=1;i<pts.length;i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
    const d = Math.hypot(x1-x0, y1-y0);
    const n = Math.max(1, Math.round(d/step));
    for(let k=1;k<=n;k++){
      const u = k/n;
      out.push([x0+(x1-x0)*u, y0+(y1-y0)*u]);
    }
  }
  return out;
}

// Wobble a point list perpendicular+tangentially using smooth noise.
function wobblePts(pts, seed, mag, close){
  const nx = makeNoise1D(seed), ny = makeNoise1D(seed+101);
  const scale = 0.35; // noise frequency along the path
  return pts.map((p,i)=>{
    let dx = nx(i*scale)*mag, dy = ny(i*scale)*mag;
    if(close && (i===0 || i===pts.length-1)){
      // keep closed shapes closed: fade endpoint offsets toward the first point's offset
      const fx = nx(0)*mag, fy = ny(0)*mag;
      dx = fx; dy = fy;
    }
    return [p[0]+dx, p[1]+dy];
  });
}

function pathFrom(pts, close){
  const p = new Path2D();
  p.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) p.lineTo(pts[i][0], pts[i][1]);
  if(close) p.closePath();
  return p;
}

// Solid mode flag: when true, characters render with opaque fills and
// thicker outlines instead of watercolor washes. Set per-character via
// opts.solid, applied in DoodleChar.begin().
let SOLID_MODE = false;

// Hand-drawn stroke: 2 passes, slight re-wobble, pencil color.
function roughStroke(ctx, pts, o={}){
  const seed  = o.seed  ?? 1;
  const wob   = o.wobble ?? 1.4;
  const close = o.close ?? false;
  const width = (o.width ?? 1.7) * (SOLID_MODE ? 1.6 : 1);
  const alpha = o.alpha ?? 0.8;
  const color = SOLID_MODE ? '#2a2a2a' : (o.color ?? PENCIL);
  const sub = subdivide(pts, 7);
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = color;
  for(let pass=0; pass<2; pass++){
    const wp = wobblePts(sub, seed + pass*104729, wob*(pass? 0.9:1), close);
    ctx.globalAlpha = pass ? alpha*0.45 : alpha;
    ctx.lineWidth = pass ? width*0.7 : width;
    ctx.stroke(pathFrom(wp, close));
  }
  ctx.restore();
}

// Watercolor fill: several perturbed low-alpha layers that bleed past the outline.
// In SOLID_MODE: single opaque fill for characters that stand out from background.
function washFill(ctx, pts, color, o={}){
  const seed   = o.seed ?? 1;
  // Solid mode: one opaque layer, no bleed
  if(SOLID_MODE){
    ctx.save();
    ctx.globalAlpha = o.solidAlpha ?? 0.95;
    ctx.fillStyle = color;
    ctx.fill(pathFrom(pts, true));
    ctx.restore();
    return;
  }
  const layers = o.layers ?? 4;
  const alpha  = o.alpha ?? 0.10;
  const bleed  = o.bleed ?? 3.0;
  const sub = subdivide(pts, 9);
  // centroid
  let cx=0, cy=0;
  for(const p of sub){ cx+=p[0]; cy+=p[1]; }
  cx/=sub.length; cy/=sub.length;
  ctx.save();
  ctx.fillStyle = color;
  for(let L=0; L<layers; L++){
    const grow = bleed * (L+1) / layers * (o.tight ? 0.6 : 1);
    const nx = makeNoise1D(seed + L*31), ny = makeNoise1D(seed + L*31 + 7);
    const wobbled = sub.map((p,i)=>{
      const vx = p[0]-cx, vy = p[1]-cy;
      const d = Math.hypot(vx,vy) || 1;
      const r = grow * (0.6 + 0.8*Math.abs(nx(i*0.4)));
      return [ p[0] + vx/d*r + nx(i*0.4)*1.1, p[1] + vy/d*r + ny(i*0.4)*1.1 ];
    });
    ctx.globalAlpha = alpha * (1 - 0.55*L/layers);
    ctx.fill(pathFrom(wobbled, true));
  }
  ctx.restore();
}

// Combined helper: filled + outlined closed shape.
function shape(ctx, pts, o={}){
  if(o.fill) washFill(ctx, pts, o.fill, o);
  roughStroke(ctx, pts, { ...o, close:true });
}

function ellipsePts(cx,cy,rx,ry,n=26,rot=0){
  const pts=[];
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2;
    const x = Math.cos(a)*rx, y = Math.sin(a)*ry;
    pts.push([cx + x*Math.cos(rot)-y*Math.sin(rot), cy + x*Math.sin(rot)+y*Math.cos(rot)]);
  }
  return pts;
}

// Scribbled ground shadow: a few overlapping wobbly ellipse arcs.
function scribbleShadow(ctx, cx, cy, w, seed){
  ctx.save();
  for(let i=0;i<3;i++){
    const rng = mulberry32(seed+i*17);
    const rx = w*(0.85+rng()*0.3), ry = w*0.16*(0.8+rng()*0.4);
    roughStroke(ctx, ellipsePts(cx+(rng()-0.5)*w*0.2, cy+(rng()-0.5)*3, rx, ry, 22),
      { seed: seed+i*991, wobble:2.2, width:1.1, alpha:0.24, close:true });
  }
  ctx.restore();
}

/* ---------- watercolor paper background ---------- */
function makePaper(w, h, seed){
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ede6d4';
  ctx.fillRect(0,0,w,h);
  // smooth blotches: a few big soft radial gradients
  const rng = mulberry32(seed);
  for(let i=0;i<10;i++){
    const x = rng()*w, y = rng()*h, r = 120+rng()*300;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    const warm = rng() < 0.5;
    g.addColorStop(0, warm ? 'rgba(210,190,150,0.10)' : 'rgba(180,180,170,0.08)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  // grain: isotropic per-pixel jitter + soft mottling (no directional streaks)
  const img = ctx.getImageData(0,0,w,h);
  const d = img.data;
  const n2 = makeNoise1D(seed+77);
  let i = 0;
  for(let y=0;y<h;y++){
    const rowMottle = n2(y*0.11)*3;
    for(let x=0;x<w;x++){
      const g = rowMottle + n2(x*0.013 + y*0.017)*4 + (rng()-0.5)*7;
      d[i] += g; d[i+1] += g; d[i+2] += g*0.9;
      i += 4;
    }
  }
  ctx.putImageData(img,0,0);
  // vignette
  const v = ctx.createRadialGradient(w/2,h/2, Math.min(w,h)*0.35, w/2,h/2, Math.max(w,h)*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(90,75,50,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0,0,w,h);
  return cv;
}
</script>
<script>
'use strict';
/* ============================================================
 * Character system — parametric doodle creatures.
 * Local space: origin at feet center, +y down, body up = -y.
 * ============================================================ */

const PALETTE = {
  skin:  ['#f2d7bd','#ecc9a8','#f5e0c8','#eac5a4','#f0d2b2'],
  cloth: ['#b9c6cc','#c9c2a4','#d4b8b0','#b3c2b0','#c6bed2','#d8cba8','#c2cfd4'],
  blob:  ['#cfc3e2','#f2cfae','#c5d4b8','#eee0a5','#ecc6c6','#bcd2d8','#e8b8c8'],
  ghost: '#f6f2e8',
  pet:      ['#e8ddc8','#d8c8a8','#c8a878','#a89070','#8a7a68','#d8b8a8','#efe8dc'],
  petMark:  ['#6b5b48','#4a4238','#8a6a52'],
  nightmare:['#3a3430','#2c2824','#453c44','#242028','#332e2a'],
  weirdo:   ['#c9c2a4','#b3c2b0','#d4b8b0','#c6bed2','#d8cba8','#b9c6cc'],
  weirdoPop:['#e0a05a','#c96a5a','#8aa860','#6a9ab0'],
};

// Modulated-circle sampler: radius varies smoothly with angle -> organic shapes.
function blobPts(cx, cy, r, seed, opts={}){
  const n = opts.n ?? 30;
  const n1 = makeNoise1D(seed), n2 = makeNoise1D(seed+31);
  const amp  = opts.amp  ?? 0.06;   // radius wobble (fraction)
  const sqX  = opts.sqX  ?? 1;      // horizontal squash
  const sqY  = opts.sqY  ?? 1;
  const jaw  = opts.jaw  ?? 0;      // widen lower half (pear head)
  const pts = [];
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2;
    let rr = r * (1 + amp*n1(i*0.55) + amp*0.5*n2(i*1.3));
    if(jaw){ rr *= 1 + jaw*Math.max(0, Math.sin(a)); } // sin>0 = lower half (y down)
    pts.push([cx + Math.cos(a)*rr*sqX, cy + Math.sin(a)*rr*sqY]);
  }
  return pts;
}

function dot(ctx, x, y, r, color, alpha=0.8){
  ctx.save();
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------------- behavior timeline ----------------
 * Segments over [0, duration]: idle / walk with x,y interp.
 * Phase accumulated so leg swing never pops. */
function buildTimeline(rng, duration, W, groundTop, groundBot, x0){
  const segs = [];
  let t = 0;
  let x = x0 ?? rng.range(W*0.08, W*0.92);
  let y = rng.range(groundTop+18, groundBot);
  let phase = rng.range(0, Math.PI*2);
  let dir = rng.chance(0.5) ? 1 : -1;
  while(t < duration){
    const walk = segs.length === 0 ? rng.chance(0.6) : !segs[segs.length-1].walk || rng.chance(0.3);
    if(walk){
      const speed = rng.range(26, 52);
      const nx = Math.max(W*0.05, Math.min(W*0.95, x + dir*rng.range(140, 420)));
      const dist = Math.abs(nx - x);
      const dur = Math.max(0.8, dist/speed);
      const ny = Math.max(groundTop+14, Math.min(groundBot, y + rng.range(-26, 30)));
      segs.push({ walk:true, t0:t, t1:t+dur, x0:x, x1:nx, y0:y, y1:ny,
                  speed:dist/dur, dir:Math.sign(nx-x)||dir, phase0:phase });
      phase += dur * (dist/dur) * 0.085;
      x = nx; y = ny; t += dur;
      if(rng.chance(0.25)) dir = -dir;
    }else{
      const dur = rng.range(1.2, 3.8);
      segs.push({ walk:false, t0:t, t1:t+dur, x0:x, x1:x, y0:y, y1:y, dir, phase0:phase });
      t += dur;
      if(rng.chance(0.4)) dir = -dir;
    }
  }
  return segs;
}

function poseAt(segs, t){
  // linear scan (segments are few)
  let s = segs[segs.length-1];
  for(let i=0;i<segs.length;i++){ if(t < segs[i].t1){ s = segs[i]; break; } }
  const u = Math.max(0, Math.min(1, (t - s.t0) / (s.t1 - s.t0)));
  const e = u*u*(3-2*u); // smooth in/out
  return {
    x: s.x0 + (s.x1-s.x0)*e,
    y: s.y0 + (s.y1-s.y0)*e,
    dir: s.dir,
    walking: s.walk,
    phase: s.phase0 + (s.walk ? (t-s.t0)*s.speed*0.085 : 0),
    speed: s.walk ? s.speed : 0,
    run: !!s.run,
    action: s.action || null,   // stationary action: cry/kneel/sweep/bow/point/angry
    actT: t - s.t0,             // time since segment start (for action cycles)
  };
}

/* ---------------- base character ---------------- */
class DoodleChar {
  constructor(seed, opts){
    const rng = new RNG(seed);
    this.seed = seed;
    this.rng = rng;
    this.h = opts.h ?? 150;                  // height in px at scale 1
    this.tl = buildTimeline(new RNG(seed^0x9e37), opts.duration, opts.W, opts.groundTop, opts.groundBot, opts.x0);
    this.blinkPeriod = rng.range(2.4, 4.8);
    this.blinkOff = rng.range(0, 5);
    this.swayOff = rng.range(0, Math.PI*2);
    this.emotes = [];   // [{what, t0, t1, seed}] — filled by script compiler
    this.solid = !!opts.solid;  // solid=true: opaque fills, thicker outlines
  }
  blinking(t){
    const m = (t + this.blinkOff) % this.blinkPeriod;
    return m < 0.13;
  }
  headTop(){ return -this.h*0.8; } // overridden per class
  drawEmotes(ctx, t){
    if(!this.emotes.length) return;
    for(const e of this.emotes){
      if(t < e.t0 || t > e.t1) continue;
      const pop = Math.min(1, (t - e.t0)/0.22);
      const sc = 1 + 2.70158*Math.pow(pop-1,3) + 1.70158*Math.pow(pop-1,2); // easeOutBack
      const fade = Math.max(0, Math.min(1, (e.t1 - t)/0.25));
      const dir = this._lookDir ?? 1;
      ctx.save();
      ctx.translate(dir*16, this.headTop() - 8);
      ctx.scale(dir*sc, sc);   // counter-flip so symbols aren't mirrored
      ctx.globalAlpha = fade;
      EMOTE_DRAW[e.what]?.(ctx, e.seed);
      ctx.restore();
    }
  }
  // Standard transform: feet at (x, groundY), flip by dir, scale by depth.
  begin(ctx, pose, depthScale){
    SOLID_MODE = this.solid;
    ctx.save();
    ctx.translate(pose.x, pose.y);
    ctx.scale(depthScale * pose.dir, depthScale);
  }
  end(ctx){ SOLID_MODE = false; ctx.restore(); }
}

/* ---------------- human ---------------- */
class Human extends DoodleChar {
  constructor(seed, opts){
    super(seed, opts);
    const rng = this.rng, h = this.h;
    this.kind = 'human';
    this.headR   = h * rng.range(0.24, 0.29);
    this.headShape = rng.pick(['round','oval','wide','pear','square']);
    this.torsoH  = h * rng.range(0.26, 0.31);
    this.legLen  = h * rng.range(0.21, 0.26);
    this.neckLen = h * 0.045;
    this.armLen  = h * rng.range(0.24, 0.28);
    this.outfit  = rng.pick(['shirt','shirt','dress']);
    this.skinC   = rng.pick(PALETTE.skin);
    this.clothC  = rng.pick(PALETTE.cloth);
    this.hair    = rng.pick(['curly','strands','bowl','side','bald','buns','spiky']);
    this.hairC   = '#6b5b48';
    this.eyeStyle= rng.pick(['open','open','wide','calm','dots']);
    this.mouth   = rng.pick(['smile','smile','flat','open','frown']);
    this.freckles= rng.chance(0.4);
    this.brows   = rng.pick(['none','none','soft','angry','sad']);
    this.glasses = rng.chance(0.14);
    this.headSquash = rng.range(0.9, 1.1);
    // ---- costume / character options (set via attrs/presets) ----
    this.beard   = opts.beard || null;    // 'white' | 'black' | null  (Ông Bụt)
    this.crown   = !!opts.crown;          // mũ miện (Vua)
    this.longHair= !!opts.longHair;       // tóc dài (Tấm)
    this.topknot = !!opts.topknot;        // búi cao (Dì ghẻ)
    this.aoDai   = !!opts.aoDai;          // áo dài cổ trang
    this.hunch   = !!opts.hunch;          // lưng còng (Bà cụ)
    this.spear   = !!opts.spear;          // tay cầm giáo (Lính)
    this.beret   = !!opts.beret;          // mũ nồi (Lính)
    this.headscarf = opts.headscarf || null; // khăn trùm đầu: màu hoặc true (Bà cụ)
  }

  headTop(){ return -(this.legLen + this.torsoH + this.neckLen + this.headR*1.85); }

  headPath(){
    const r = this.headR, cy = -(this.legLen + this.torsoH + this.neckLen + this.headR*0.82);
    const o = { amp:0.05, seed:this.seed^0x11 };
    switch(this.headShape){
      case 'oval':   return { pts: blobPts(0, cy, r, this.seed^0x11, {...o, sqX:0.85*this.headSquash, sqY:1.12}), cy };
      case 'wide':   return { pts: blobPts(0, cy, r, this.seed^0x11, {...o, sqX:1.18*this.headSquash, sqY:0.9}), cy };
      case 'pear':   return { pts: blobPts(0, cy, r, this.seed^0x11, {...o, jaw:0.22, sqX:this.headSquash}), cy };
      case 'square': return { pts: blobPts(0, cy, r, this.seed^0x11, {...o, amp:0.03, sqX:1.02, sqY:0.98}), cy };
      default:       return { pts: blobPts(0, cy, r, this.seed^0x11, {...o, sqX:this.headSquash}), cy };
    }
  }

  drawHead(ctx, t, blink){
    const { pts, cy } = this.headPath();
    const r = this.headR;
    shape(ctx, pts, { seed:this.seed^0x12, fill:this.skinC, alpha:0.20, bleed:2.6, width:1.8 });

    // ears
    for(const s of [-1,1]){
      const ex = s*r*0.95, ey = cy + r*0.05;
      shape(ctx, ellipsePts(ex, ey, r*0.14, r*0.18, 14),
        { seed:this.seed^0x13+s, fill:this.skinC, alpha:0.15, width:1.3 });
    }

    // eyes
    const eyeDX = r*0.38, eyeY = cy - r*0.08;
    for(const s of [-1,1]){
      const ex = s*eyeDX;
      if(blink){
        roughStroke(ctx, [[ex-r*0.13, eyeY],[ex+r*0.13, eyeY]], { seed:this.seed+s*7, wobble:0.5, width:1.4 });
      } else if(this.eyeStyle === 'dots'){
        dot(ctx, ex, eyeY, r*0.06, PENCIL, 0.85);
      } else {
        const er = this.eyeStyle === 'wide' ? r*0.17 : r*0.13;
        shape(ctx, ellipsePts(ex, eyeY, er, er*1.08, 14),
          { seed:this.seed^0x14+s, fill:'#fdfbf5', alpha:0.35, bleed:1, tight:true, width:1.3 });
        dot(ctx, ex + (this._lookDir ?? 1)*er*0.28, eyeY + er*0.1, er*0.38, PENCIL, 0.9);
        if(this.eyeStyle === 'calm')
          roughStroke(ctx, [[ex-er, eyeY-er*0.9],[ex+er, eyeY-er*0.9]], { seed:this.seed+s*13, wobble:0.5, width:1.2, alpha:0.6 });
      }
    }

    // brows
    if(this.brows !== 'none'){
      for(const s of [-1,1]){
        const bx = s*eyeDX, by = eyeY - r*0.36;
        const tilt = this.brows === 'angry' ? -s*r*0.12 : this.brows === 'sad' ? s*r*0.12 : 0;
        roughStroke(ctx, [[bx-r*0.14, by-tilt],[bx+r*0.14, by+tilt]], { seed:this.seed+s*29, wobble:0.5, width:1.5, alpha:0.75 });
      }
    }

    // nose
    roughStroke(ctx, [[0, cy+r*0.02],[r*0.07, cy+r*0.18],[0, cy+r*0.22]],
      { seed:this.seed^0x15, wobble:0.4, width:1.2, alpha:0.6 });

    // mouth
    const my = cy + r*0.42;
    if(this.mouth === 'smile')
      roughStroke(ctx, arcPts(0, my-r*0.05, r*0.30, 0.25, Math.PI-0.25), { seed:this.seed^0x16, wobble:0.5, width:1.5 });
    else if(this.mouth === 'frown')
      roughStroke(ctx, arcPts(0, my+r*0.22, r*0.26, Math.PI+0.3, -0.3), { seed:this.seed^0x16, wobble:0.5, width:1.5 });
    else if(this.mouth === 'open')
      shape(ctx, ellipsePts(0, my+r*0.05, r*0.12, r*0.15, 12), { seed:this.seed^0x16, fill:'#8a5a52', alpha:0.5, tight:true, width:1.3 });
    else
      roughStroke(ctx, [[-r*0.16, my],[r*0.16, my]], { seed:this.seed^0x16, wobble:0.4, width:1.4 });

    // freckles
    if(this.freckles){
      const fr = new RNG(this.seed^0x17);
      for(let i=0;i<5;i++)
        dot(ctx, (fr.next()-0.5)*r*1.3, cy + r*0.28 + (fr.next()-0.5)*r*0.25, 1.1, PENCIL, 0.4);
    }

    // glasses
    if(this.glasses && !blink){
      for(const s of [-1,1])
        roughStroke(ctx, ellipsePts(s*eyeDX, eyeY, r*0.26, r*0.24, 16), { seed:this.seed+s*41, wobble:0.5, width:1.2, close:true });
      roughStroke(ctx, [[-eyeDX+r*0.26, eyeY],[eyeDX-r*0.26, eyeY]], { seed:this.seed^0x18, wobble:0.3, width:1.2 });
    }

    // ---- beard (Ông Bụt) ----
    if(this.beard){
      const bc = this.beard === 'white' ? '#e8e4da' : '#3a3128';
      const wv = Math.sin((this._tNow||0)*2)*r*0.06;
      const pts = [[-r*0.42, cy+r*0.42],[ -r*0.5+wv, cy+r*1.05],[-r*0.2+wv, cy+r*1.5],
                   [0+wv, cy+r*1.62],[r*0.2+wv, cy+r*1.5],[r*0.5+wv, cy+r*1.05],[r*0.42, cy+r*0.42]];
      shape(ctx, pts, { seed:this.seed^0x1a, fill:bc, alpha:0.35, tight:true, width:1.5 });
    }

    // ---- crown / mũ miện (Vua) ----
    if(this.crown){
      const cw = r*0.72, ch = r*0.42, cyy = cy - r*1.02;
      const pts = [[-cw, cyy],[ -cw, cyy-ch],[ -cw*0.5, cyy-ch*0.45],[0, cyy-ch*1.15],
                   [cw*0.5, cyy-ch*0.45],[cw, cyy-ch],[cw, cyy]];
      shape(ctx, pts, { seed:this.seed^0x1b, fill:'#e8b83a', alpha:0.4, tight:true, width:1.6 });
      dot(ctx, 0, cyy-ch*1.15, r*0.07, '#c0392b', 0.9);
      dot(ctx, -cw*0.5, cyy-ch*0.45, r*0.05, '#c0392b', 0.85);
      dot(ctx, cw*0.5, cyy-ch*0.45, r*0.05, '#c0392b', 0.85);
    }

    this.drawHair(ctx, cy);

    // ---- beret / mũ nồi (Lính) ----
    if(this.beret){
      const bw = r*0.78, byy = cy - r*1.04;
      ctx.save(); ctx.translate(0, byy); ctx.rotate(-0.12); ctx.translate(0, -byy);
      shape(ctx, ellipsePts(0, byy, bw, r*0.26, 16),
        { seed:this.seed^0x1c, fill:'#2a3a5a', alpha:0.42, tight:true, width:1.6 });
      dot(ctx, -bw*0.12, byy - r*0.27, r*0.05, '#2a3a5a', 0.9);
      ctx.restore();
    }

    // ---- headscarf / khăn mỏ quạ (Bà cụ) ----
    if(this.headscarf){
      const sc = this.headscarf === true ? '#26221e' : this.headscarf;
      const band = arcPts(0, cy, r*1.07, Math.PI*1.02, Math.PI*1.98, 16)
        .concat(arcPts(0, cy, r*0.80, Math.PI*1.98, Math.PI*1.02, 16));
      shape(ctx, band, { seed:this.seed^0x1d, fill:sc, alpha:0.45, tight:true, width:1.6 });
      // 2 đuôi khăn buông sau gáy
      const wv = Math.sin((this._tNow||0)*1.8)*r*0.05;
      roughStroke(ctx, [[-r*0.78, cy+r*0.08],[-r*0.98+wv, cy+r*0.78]],
        { seed:this.seed^0x1e, wobble:0.6, width:2.0, color:sc });
      roughStroke(ctx, [[-r*0.62, cy+r*0.14],[-r*0.72+wv, cy+r*0.72]],
        { seed:this.seed^0x1f, wobble:0.6, width:1.6, color:sc });
    }
  }

  drawHair(ctx, cy){
    const r = this.headR, seed = this.seed^0x19;
    const top = cy - r*0.92;
    // ---- Tấm Cám costumes: tóc dài / búi cao ----
    if(this.longHair){
      const rr = new RNG(seed^0x5a);
      for(const s of [-1,1]){
        for(let i=0;i<4;i++){
          const hx = s*r*(0.55 + i*0.14);
          const len = r*(1.6 + rr.next()*0.5);
          const swayH = Math.sin((this._tNow||0)*1.8 + i)*r*0.08;
          roughStroke(ctx, [[hx, top+r*0.1],[hx+s*r*0.1+swayH, top+r*0.5],[hx+swayH*1.6, top+len]],
            { seed:seed+s*7+i, wobble:0.8, width:1.6 });
        }
      }
      shape(ctx, arcPts(0, cy, r*1.0, Math.PI*1.02, Math.PI*1.98, 16)
        .concat(arcPts(0, cy, r*0.72, Math.PI*1.98, Math.PI*1.02, 16)),
        { seed, fill:this.hairC, alpha:0.32, tight:true, width:1.4 });
      return;
    }
    if(this.topknot){
      shape(ctx, ellipsePts(0, top-r*0.12, r*0.34, r*0.30, 14),
        { seed:seed^0x6b, fill:this.hairC, alpha:0.32, tight:true, width:1.5 });
      roughStroke(ctx, [[-r*0.2, top-r*0.3],[0, top-r*0.5],[r*0.2, top-r*0.3]],
        { seed:seed^0x6c, wobble:0.6, width:1.4 });
      shape(ctx, arcPts(0, cy, r*1.0, Math.PI*1.05, Math.PI*1.95, 16)
        .concat(arcPts(0, cy, r*0.74, Math.PI*1.95, Math.PI*1.05, 16)),
        { seed, fill:this.hairC, alpha:0.3, tight:true, width:1.4 });
      return;
    }
    switch(this.hair){
      case 'curly': {
        const rr = new RNG(seed);
        for(let i=0;i<9;i++){
          const a = Math.PI + (i+0.5)/9*Math.PI; // upper arc
          const hx = Math.cos(a)*r*0.95, hy = cy + Math.sin(a)*r*0.92;
          shape(ctx, ellipsePts(hx, hy, r*0.16+rr.next()*r*0.05, r*0.15, 12),
            { seed:seed+i, fill:this.hairC, alpha:0.25, tight:true, width:1.2 });
        }
        break;
      }
      case 'strands': {
        const rr = new RNG(seed);
        for(let i=0;i<5;i++){
          const hx = (i/4-0.5)*r*1.1;
          const len = r*(0.25+rr.next()*0.3);
          roughStroke(ctx, [[hx, top+r*0.12],[hx+(rr.next()-0.5)*r*0.3, top-len]],
            { seed:seed+i*3, wobble:0.8, width:1.5 });
        }
        break;
      }
      case 'bowl': {
        // band across the upper head
        const band = arcPts(0, cy, r*0.99, Math.PI*1.05, Math.PI*1.95, 16)
          .concat(arcPts(0, cy, r*0.72, Math.PI*1.95, Math.PI*1.05, 16));
        shape(ctx, band, { seed, fill:this.hairC, alpha:0.3, tight:true, width:1.4 });
        break;
      }
      case 'side': {
        const pts = arcPts(0, cy, r*1.0, Math.PI*1.0, Math.PI*1.75, 14)
          .concat(arcPts(0, cy, r*0.6, Math.PI*1.75, Math.PI*1.0, 14));
        shape(ctx, pts, { seed, fill:this.hairC, alpha:0.3, tight:true, width:1.4 });
        break;
      }
      case 'buns': {
        for(const s of [-1,1])
          shape(ctx, ellipsePts(s*r*0.78, top+r*0.05, r*0.24, r*0.22, 14),
            { seed:seed+s, fill:this.hairC, alpha:0.3, tight:true, width:1.4 });
        break;
      }
      case 'bun': {  // búi thấp sau gáy (Bà cụ)
        shape(ctx, ellipsePts(-r*0.44, cy+r*0.42, r*0.27, r*0.25, 14),
          { seed:seed^0x6d, fill:this.hairC, alpha:0.32, tight:true, width:1.5 });
        roughStroke(ctx, [[-r*0.44, cy+r*0.2],[-r*0.44, cy+r*0.42]],
          { seed:seed^0x6e, wobble:0.5, width:1.4 });
        const cap = arcPts(0, cy, r*1.0, Math.PI*1.08, Math.PI*1.92, 16)
          .concat(arcPts(0, cy, r*0.78, Math.PI*1.92, Math.PI*1.08, 16));
        shape(ctx, cap, { seed, fill:this.hairC, alpha:0.28, tight:true, width:1.3 });
        break;
      }
      case 'short': {  // tóc ngắn (Lính)
        const band = arcPts(0, cy, r*0.99, Math.PI*1.08, Math.PI*1.92, 16)
          .concat(arcPts(0, cy, r*0.80, Math.PI*1.92, Math.PI*1.08, 16));
        shape(ctx, band, { seed, fill:this.hairC, alpha:0.3, tight:true, width:1.4 });
        for(const s of [-1,1])
          roughStroke(ctx, [[s*r*0.88, cy-r*0.1],[s*r*0.95, cy+r*0.28]],
            { seed:seed+s, wobble:0.4, width:1.3 });
        break;
      }
      case 'spiky': {
        const rr = new RNG(seed);
        const pts = [];
        for(let i=0;i<=8;i++){
          const x = -r*0.9 + i/8*r*1.8;
          pts.push([x, top+r*0.25]);
          pts.push([x + r*0.11, top - r*(0.12+rr.next()*0.18)]);
        }
        pts.push([r*0.9, top+r*0.25]);
        shape(ctx, pts, { seed, fill:this.hairC, alpha:0.3, tight:true, width:1.3 });
        break;
      }
      default: break; // bald
    }
  }

  draw(ctx, t, depthScale){
    const pose = poseAt(this.tl, t);
    this._lookDir = pose.dir;
    this._tNow = t;
    const p = pose.phase;
    const walkAmt = pose.walking ? 1 : 0;
    // ---- stationary actions: cry/kneel/sweep/bow/point/angry ----
    const action = pose.action || null;
    const at = pose.actT || 0;
    let bob = pose.walking ? -Math.abs(Math.sin(p))*this.h*(pose.run?0.04:0.022) : Math.sin(t*1.6+this.swayOff)*1.2;
    let sway = pose.walking ? Math.sin(p)*(pose.run?0.05:0.02) : Math.sin(t*1.1+this.swayOff)*0.035;
    let actLean = 0;      // extra torso lean (radians)
    let actDrop = 0;      // extra body drop (kneel)
    let headTilt = 0, headDY = 0;
    // action arm/leg targets: [x, y] in local space (y-down), null = default swing
    let actArmL = null, actArmR = null, actKick = null;
    let axeInfo = null;   // chop: vẽ rìu ({lift, mx, my} tại điểm giữa 2 tay)
    let carryPole = null; // carry: vẽ đòn gánh + thùng nước ({y, bounce})
    let catchRip = null;  // catch: vẽ gợn sóng ([x, y])
    let chopMouth = false;// chop: há miệng khi bổ xuống
    let climbTrunk = 0;   // climb: x của thân cau (lệch trái để không che mặt)
    const syA = -(this.legLen + this.torsoH*0.88) + 2;   // shoulder line y
    const swA = this.headR*0.52;                          // half shoulder width
    const cyc = (period) => (at % period) / period;       // 0..1 repeating
    const strike = (period=1.0) => Math.sin(Math.min(1, cyc(period)*1.12) * Math.PI); // out-and-back
    const guardL = [-swA*0.7, syA - this.armLen*0.55];    // left hand guard pose
    const guardR = [ swA*0.7, syA - this.armLen*0.55];    // right hand guard pose
    if(action === 'cry'){
      bob = Math.sin(t*16)*2.2; sway = Math.sin(t*2.1)*0.02;
      headTilt = 0.28; headDY = 4; actLean = 0.10;
    } else if(action === 'bow'){
      actLean = 0.55; headTilt = 0.35; headDY = 6; bob = 0;
    } else if(action === 'sweep'){
      bob = -Math.abs(Math.sin(t*4))*3; sway = Math.sin(t*4)*0.05; actLean = 0.12;
    } else if(action === 'angry'){
      const stomp = Math.abs(Math.sin(t*5.2)) > 0.72 ? 1 : 0;
      bob = -stomp*4; sway = 0; actLean = -0.05;
    } else if(action === 'kneel'){
      actDrop = this.legLen*0.52; bob = 0; sway = 0;
    } else if(action === 'point'){
      bob = 0; sway = Math.sin(t*1.4)*0.015;
      actArmR = [swA + this.armLen*1.05, syA - this.armLen*0.15];
    } else if(action === 'punch'){
      // đấm thẳng: tay phải đâm ra nhanh, tay trái thủ
      const e = strike(1.0);
      actArmR = [swA + this.armLen*1.30*e, syA - this.armLen*0.05*e];
      actArmL = guardL; actLean = 0.10*e; bob = 0; sway = 0;
    } else if(action === 'punch_hook'){
      // đấm móc: tay vòng từ dưới lên
      const ph = Math.min(1, cyc(1.1)*1.12) * Math.PI;
      actArmR = [swA + Math.sin(ph)*this.armLen*1.05, syA + Math.cos(ph)*this.armLen*0.65];
      actArmL = guardL; actLean = 0.08*Math.sin(ph); bob = 0; sway = 0;
    } else if(action === 'kick'){
      // đá thẳng: chân trước đạp ra, 2 tay thủ
      const e = strike(1.1);
      actKick = [this.legLen*1.15*e, -this.legLen*0.38*e];
      actArmL = guardL; actArmR = guardR;
      actLean = -0.09*e; bob = 0; sway = 0;
    } else if(action === 'kick_round'){
      // đá vòng: chân quét ngang theo vòng cung
      const ph = Math.min(1, cyc(1.2)*1.12) * Math.PI;
      actKick = [Math.sin(ph)*this.legLen*1.20, -this.legLen*0.22*Math.sin(ph*0.5+0.3)];
      actArmL = guardL; actArmR = guardR;
      actLean = -0.06*Math.sin(ph); bob = 0; sway = 0;
    } else if(action === 'block'){
      // đỡ đòn: 2 tay chéo trước mặt, hơi khụy
      actArmL = [ swA*0.45, syA - this.headR*1.25];
      actArmR = [-swA*0.45, syA - this.headR*1.05];
      actDrop = this.legLen*0.10; bob = Math.sin(t*30)*1.2; sway = 0;
    } else if(action === 'dodge'){
      // né tránh: người ngả ra sau
      const e = Math.sin(Math.min(1, at/0.7) * Math.PI);
      actLean = -0.38*e; bob = -4*e; sway = 0;
      actArmL = [-swA - this.armLen*0.6, syA - this.armLen*0.3];
      actArmR = [ swA + this.armLen*0.6, syA - this.armLen*0.3];
    } else if(action === 'fall'){
      // ngã: cả người đổ về phía trước
      const k = Math.min(1, at/0.8), ke = k*k;
      actLean = 1.30*ke; sway = 0;
      bob = ke >= 1 ? -Math.abs(Math.sin((at-0.8)*10))*3*Math.exp(-(at-0.8)*3) : 0;
      actArmL = [-swA - this.armLen*0.8, syA + this.armLen*0.4];
      actArmR = [ swA + this.armLen*0.8, syA + this.armLen*0.4];
    } else if(action === 'handshake'){
      // bắt tay: tay phải đưa ra ngang, rung nhẹ
      const sh = Math.sin(at*9)*5*(at < 2 ? 1 : 0.25);
      actArmR = [swA + this.armLen*1.0, syA + this.armLen*0.12 + sh];
      actLean = 0.06; bob = 0;
    } else if(action === 'hug'){
      // ôm: 2 tay dang rộng
      actArmL = [-swA - this.armLen*1.10, syA + this.armLen*0.30];
      actArmR = [ swA + this.armLen*1.10, syA + this.armLen*0.30];
      actLean = 0.05; bob = Math.sin(t*2)*2; sway = 0;
    } else if(action === 'pat'){
      // vỗ vai: tay phải giơ cao vỗ nhẹ
      actArmR = [swA + this.armLen*0.42, syA - this.armLen*0.92 + Math.sin(at*7)*6];
      bob = 0;
    } else if(action === 'give'){
      // đưa đồ: tay phải đưa về phía trước, hơi cúi
      actArmR = [swA + this.armLen*0.95, syA + this.armLen*0.52];
      actLean = 0.09; bob = 0;
    } else if(action === 'push'){
      // đẩy: 2 tay đẩy ra phía trước
      const pc = Math.sin(Math.min(1, cyc(1.2)*1.12) * Math.PI);
      actArmL = [this.armLen*(0.55+0.35*pc), syA + this.armLen*0.10];
      actArmR = [swA + this.armLen*(0.75+0.35*pc), syA - this.armLen*0.05*pc];
      actLean = 0.13*pc; bob = 0; sway = 0;
    } else if(action === 'pull'){
      // kéo: 2 tay co về, người ngả ra sau
      actArmL = [this.armLen*0.15, syA + this.armLen*0.42];
      actArmR = [swA + this.armLen*0.30, syA + this.armLen*0.42];
      actLean = -0.10; bob = 0; sway = 0;
    } else if(action === 'climb'){
      // trèo cau: người thẳng đứng, 2 tay giơ cao bám, 2 chân co đạp luân phiên
      const cph = at*4.2;
      const alt = Math.sin(cph);
      const gripX = -30;  // thân cau lệch trái để không che mặt
      actArmL = [gripX-20, syA - this.armLen*1.10 + Math.max(0, alt)*this.armLen*0.16];
      actArmR = [gripX+20, syA - this.armLen*1.10 + Math.max(0,-alt)*this.armLen*0.16];
      actLean = 0.06; headTilt = -0.22; headDY = -2;
      bob = -Math.abs(Math.sin(cph*0.5))*3; sway = Math.sin(cph*0.5)*0.03;
      climbTrunk = gripX;
    } else if(action === 'catch'){
      // bắt tép: cúi sâu về phía trước, 2 tay chụm vớt nước
      const cph = at*3.2;
      const dip = Math.sin(cph);
      actLean = 0.42; headTilt = 0.35; headDY = 6; bob = 0; sway = dip*0.02;
      actArmL = [-swA*0.50 + dip*6, syA + this.armLen*1.42 + dip*10];
      actArmR = [ swA*0.50 + dip*6, syA + this.armLen*1.42 + dip*10];
      catchRip = [dip*6, syA + this.armLen*1.42 + dip*10 + 16];  // gợn sóng ở tay
    } else if(action === 'carry'){
      // gánh nước: vai gánh đòn, 2 tay giữ đòn, bước đều tại chỗ
      const cph = at*4.0;
      const bounce = Math.sin(cph*2)*4;                 // đòn gánh nhịp nhàng
      bob = -Math.abs(Math.sin(cph))*3.5; sway = Math.sin(cph)*0.03;
      actArmL = [-swA*1.35, syA + 4 - bounce*0.4];
      actArmR = [ swA*1.35, syA + 4 - bounce*0.4];
      headTilt = 0; headDY = -2;
      carryPole = { y: syA + 8, bounce };
    } else if(action === 'weave'){
      // dệt vải: ngồi trước khung cửi, 2 tay đưa thoi qua lại
      const cph = at*5.2;
      const shuttle = Math.sin(cph)*this.armLen*0.75;
      actDrop = this.legLen*0.42; headTilt = 0.30; headDY = 6; bob = 0;
      sway = Math.sin(cph)*0.015;
      actArmL = [-swA*0.6 + shuttle*0.6, syA + this.armLen*0.55];
      actArmR = [ swA*0.6 + shuttle*0.6, syA + this.armLen*0.55];
    } else if(action === 'sit' || action === 'sit_point' || action === 'sit_angry'){
      // ngồi ghế: thân hạ thấp, đùi duỗi về trước, tay đặt trên đùi
      actDrop = this.legLen*0.42; headTilt = 0.05; headDY = 4; bob = 0; sway = 0;
      actArmL = [-swA*0.7, syA + this.armLen*0.75];
      actArmR = [ swA*0.7, syA + this.armLen*0.75];
      if(action === 'sit_point'){
        actArmR = [swA + this.armLen*1.05, syA - this.armLen*0.15];  // chỉ tay phải
      } else if(action === 'sit_angry'){
        actArmL = [-swA*1.5, syA + this.torsoH*0.52];  // chống nạnh khi ngồi
        actArmR = [ swA*1.5, syA + this.torsoH*0.52];
      }
    } else if(action === 'chop'){
      // chặt/đốn: 2 tay giơ cao cầm rìu, bổ mạnh xuống (chu kỳ 1.4s)
      const u = cyc(1.4);
      let lift;
      if(u < 0.55)      lift = u/0.55;            // giơ lên
      else if(u < 0.72) lift = 1 - (u-0.55)/0.17; // bổ xuống nhanh
      else              lift = (u-0.72)/0.28*0.25; // nhấc nhẹ chuẩn bị vòng mới
      lift = Math.max(0, Math.min(1, lift));
      const hy = syA + this.armLen*(0.45 - 1.75*lift);
      actArmL = [-swA*0.55, hy];
      actArmR = [ swA*0.55, hy];
      actLean = 0.34*(1-lift) - 0.10*lift;
      actDrop = this.legLen*0.10*(1-lift);
      bob = -(1-lift)*3; sway = 0;
      headTilt = 0.15*(1-lift); headDY = 3*(1-lift);
      axeInfo = { lift, mx: 0, my: hy };
      chopMouth = (u >= 0.50 && u <= 0.85);
    } else if(action === 'panic'){
      // hoảng sợ/kêu cứu: 2 tay giơ cao vẫy, miệng há to, mắt trợn
      const cph = at*11;
      actArmL = [-swA - this.armLen*0.85, syA - this.armLen*1.02 + Math.sin(cph)*9];
      actArmR = [ swA + this.armLen*0.85, syA - this.armLen*1.02 + Math.sin(cph + Math.PI)*9];
      bob = -Math.abs(Math.sin(at*2.6))*7 + Math.sin(cph)*1.6;
      sway = Math.sin(at*3.1)*0.05; actLean = -0.10;
      headTilt = -0.28; headDY = -3;
    }
    // ---- hunch: lưng còng (Bà cụ) — posture cố định, cộng dồn với action ----
    if(this.hunch){
      actLean += 0.30; headTilt += 0.30; headDY += 7;
    }
    const blink = this.blinking(t);

    scribbleShadow(ctx, pose.x, pose.y+2, this.headR*1.35*depthScale, this.seed^0x20);

    this.begin(ctx, pose, depthScale);
    ctx.translate(0, bob + actDrop);
    ctx.rotate(sway + actLean);

    const hipY = -this.legLen, shoulderY = -(this.legLen + this.torsoH*0.88);
    const shoulderW = this.headR*0.52;

    if(action === 'climb'){  // thân cây cau sau lưng nhân vật (vẽ trước người)
      const topY = -(this.legLen + this.torsoH + this.headR*2.7);
      const tx = climbTrunk;
      roughStroke(ctx, [[tx-7, 16],[tx+5, topY*0.45],[tx-5, topY]], { seed:this.seed^0x73, wobble:1.4, width:4.5 });
      for(let ri=0; ri<5; ri++){  // vết đốt thân cau
        const ry = topY*0.12 + ri*(topY*0.76)/4;
        roughStroke(ctx, [[tx-12, ry],[tx+10, ry]], { seed:this.seed^0x74+ri, wobble:0.8, width:1.3, alpha:0.55 });
      }
    }

    // legs (behind torso) — action variants: kneel (folded) / angry (stomp)
    const stride = this.legLen*(pose.run?0.62:0.42)*walkAmt;
    const liftH  = this.legLen*(pose.run?0.22:0.16);
    if(action === 'kneel'){
      for(const s of [-1,1]){  // quỳ: đùi gập, chân xếp dưới thân
        roughStroke(ctx, [[s*5, hipY],[s*16, hipY+this.legLen*0.38],[s*4, hipY+this.legLen*0.55]],
          { seed:this.seed+s*53, wobble:0.9, width:1.7 });
        roughStroke(ctx, [[s*4, hipY+this.legLen*0.55],[s*22, hipY+this.legLen*0.55]],
          { seed:this.seed+s*59, wobble:0.4, width:1.6 });
      }
    } else if(action === 'climb'){
      // trèo cau: 2 chân co, đầu gối mở, bàn chân đạp thân cây luân phiên
      for(const s of [-1,1]){
        const cph = at*4.2 + (s<0 ? Math.PI : 0);
        const bend = (Math.sin(cph)+1)/2;  // 0..1: co duỗi luân phiên
        const kneeX = climbTrunk + s*this.legLen*0.30, kneeY = hipY + this.legLen*0.44;
        const footX = climbTrunk + s*this.legLen*0.10, footY = -this.legLen*(0.12 + bend*0.38);
        roughStroke(ctx, [[0, hipY],[kneeX, kneeY],[footX, footY]], { seed:this.seed+s*53, wobble:0.9, width:1.6 });
        roughStroke(ctx, [[footX, footY],[footX + 8, footY]], { seed:this.seed+s*59, wobble:0.4, width:1.6 });
      }
    } else if(action === 'weave' || action === 'sit' || action === 'sit_point' || action === 'sit_angry'){
      // ngồi (dệt / ngồi ghế): đùi duỗi về phía trước, cẳng chân gập xuống (bàn chân chạm đất)
      for(const s of [-1,1]){
        const kneeX = this.legLen*0.52 + s*7, kneeY = hipY + this.legLen*0.12;
        const footX = this.legLen*0.58 + s*7, footY = hipY + this.legLen*0.58;
        roughStroke(ctx, [[0, hipY],[kneeX, kneeY],[footX, footY]], { seed:this.seed+s*53, wobble:0.9, width:1.6 });
      }
    } else if(action === 'carry'){
      // gánh nước: bước đều tại chỗ
      for(const s of [-1,1]){
        const cph = at*4.0 + (s<0 ? Math.PI : 0);
        const fx = Math.sin(cph)*this.legLen*0.14;
        const fy = -Math.max(0, Math.cos(cph))*this.legLen*0.10;
        const knee = [fx/2 + this.legLen*0.05, hipY + this.legLen*0.5];
        roughStroke(ctx, [[0, hipY], knee, [fx, fy]], { seed:this.seed+s*53, wobble:0.9, width:1.6 });
        roughStroke(ctx, [[fx, fy],[fx + 4, fy]], { seed:this.seed+s*59, wobble:0.4, width:1.6 });
      }
    } else if(action === 'catch'){
      // cúi vớt: hơi khụy gối để không giống ngã
      for(const s of [-1,1]){
        const knee = [s*5 + this.legLen*0.12, hipY + this.legLen*0.52];
        roughStroke(ctx, [[0, hipY], knee, [s*4, -2]], { seed:this.seed+s*53, wobble:0.9, width:1.6 });
        roughStroke(ctx, [[s*4, -2],[s*4 + 4, -2]], { seed:this.seed+s*59, wobble:0.4, width:1.6 });
      }
    } else {
      const stomp = action === 'angry' && Math.abs(Math.sin(t*5.2)) > 0.72;
      for(const s of [-1,1]){
        const ph = p + (s<0 ? Math.PI : 0);
        let fx = Math.sin(ph)*stride;
        let fy = -Math.max(0, Math.cos(ph))*liftH*walkAmt;
        if(stomp && s > 0){ fx = 10; fy = -this.legLen*0.38; }  // chân dậm
        else if(actKick && s > 0){ fx = actKick[0]; fy = actKick[1]; }  // đá: chân trước vung ra
        const knee = [ (0+fx)/2 + this.legLen*0.06, hipY + this.legLen*0.5 ];
        roughStroke(ctx, [[0, hipY], knee, [fx, fy]], { seed:this.seed+s*53, wobble:0.9, width:1.6 });
        // foot
        roughStroke(ctx, [[fx, fy],[fx + this.legLen*0.14*walkAmt + 4, fy]], { seed:this.seed+s*59, wobble:0.4, width:1.6 });
      }
    }

    // torso
    if(this.outfit === 'dress'){
      const pts = [[-shoulderW, shoulderY],[shoulderW, shoulderY],
                   [this.headR*0.75, hipY+this.legLen*0.28],[-this.headR*0.75, hipY+this.legLen*0.28]];
      shape(ctx, pts, { seed:this.seed^0x21, fill:this.clothC, alpha:0.22, bleed:2.4, width:1.7 });
    } else {
      const pts = [[-shoulderW, shoulderY],[shoulderW, shoulderY],
                   [shoulderW*0.92, hipY+4],[-shoulderW*0.92, hipY+4]];
      shape(ctx, pts, { seed:this.seed^0x21, fill:this.clothC, alpha:0.22, bleed:2.4, width:1.7 });
      // collar
      roughStroke(ctx, [[-shoulderW*0.35, shoulderY],[0, shoulderY+this.torsoH*0.14],[shoulderW*0.35, shoulderY]],
        { seed:this.seed^0x22, wobble:0.5, width:1.3, alpha:0.7 });
    }

    // neck
    roughStroke(ctx, [[-3, shoulderY-2],[-3, shoulderY-this.neckLen]], { seed:this.seed^0x23, wobble:0.3, width:1.5 });
    roughStroke(ctx, [[ 3, shoulderY-2],[ 3, shoulderY-this.neckLen]], { seed:this.seed^0x24, wobble:0.3, width:1.5 });

    // arms — action variants override hand targets
    const armSwing = (pose.walking ? Math.sin(p)*0.5 : 0) + Math.sin(t*1.3+this.swayOff)*0.06;
    let broomTip = null;  // sweep: vẽ chổi
    let spearHand = null; // spear: tay phải cầm giáo
    if(carryPole){  // đòn gánh trên vai + 2 thùng nước (vẽ trước tay để tay nắm lên trên)
      const py = carryPole.y + carryPole.bounce;
      const ex = this.armLen*1.55;
      roughStroke(ctx, [[-ex, py],[ex, py]], { seed:this.seed^0x7b, wobble:0.8, width:3.2 });
      for(const s of [-1,1]){
        const bx = s*(ex - 10);
        roughStroke(ctx, [[bx, py],[bx, py + this.armLen*0.95]], { seed:this.seed^0x7c+s, wobble:0.5, width:1.6 });
        const bw = 16, bh = 20, by = py + this.armLen*0.95;
        shape(ctx, [[bx-bw, by],[bx+bw, by],[bx+bw*0.8, by+bh],[bx-bw*0.8, by+bh]],
          { seed:this.seed^0x7d+s, fill:'#9a7a54', alpha:0.3, tight:true, width:1.5 });
        roughStroke(ctx, [[bx-bw*0.9, by+bh*0.35],[bx+bw*0.9, by+bh*0.35]],
          { seed:this.seed^0x7e+s, wobble:0.4, width:1.2, alpha:0.7 });
      }
    }
    for(const s of [-1,1]){
      const sx = s*shoulderW, sy = shoulderY + 2;
      const flail = Math.sin(p*2 + (s<0?0:Math.PI))*0.4;
      const sw = pose.run ? (Math.PI*0.85 + s*0.30 + flail) : (s<0 ? armSwing : -armSwing);
      let hx = sx + s*this.armLen*0.28 + Math.sin(sw)*this.armLen*0.8;
      let hy = sy + Math.cos(sw)*this.armLen*0.85;
      let elbowOut = 3;
      if(action === 'cry'){            // tay che mặt
        hx = s*shoulderW*0.45; hy = sy - this.headR*1.55; elbowOut = 10;
      } else if(action === 'sweep'){    // hai tay cầm chổi, đưa qua lại
        const swp = Math.sin(t*4.2);
        hx = swp*this.armLen*0.62; hy = sy + this.armLen*0.52; elbowOut = 5;
        if(s > 0) broomTip = [hx, hy];
      } else if(action === 'bow'){      // tay buông thõng
        hx = s*shoulderW*0.75; hy = sy + this.armLen*0.95; elbowOut = 2;
      } else if(action === 'point'){     // chỉ tay (tay phải)
        if(s > 0){ hx = this.armLen*1.02; hy = sy - 6; elbowOut = 2; }
        else { hx = s*shoulderW*0.7; hy = sy + this.armLen*0.85; elbowOut = 2; }
      } else if(action === 'angry'){    // chống nạnh
        hx = s*shoulderW*1.5; hy = sy + this.torsoH*0.52; elbowOut = 14;
      } else if(action === 'kneel'){    // tay đặt lên đùi
        hx = s*shoulderW*0.9; hy = sy + this.torsoH*0.78; elbowOut = 4;
      } else if(actArmL || actArmR){  // combat/interaction: tay theo target tính sẵn
        const ov = s < 0 ? actArmL : actArmR;
        if(ov){ hx = ov[0]; hy = ov[1]; elbowOut = 4; }
      }
      const elbow = [ (sx+hx)/2 + s*elbowOut, (sy+hy)/2 + 2 ];
      roughStroke(ctx, [[sx, sy], elbow, [hx, hy]], { seed:this.seed+s*61, wobble:0.8, width:1.6 });
      if(action === 'point' && s > 0){
        roughStroke(ctx, [[hx, hy],[hx+14, hy-2]], { seed:this.seed+s*63, wobble:0.3, width:1.5 }); // ngón trỏ
      }
      shape(ctx, ellipsePts(hx, hy, 3.2, 3.2, 10), { seed:this.seed+s*67, fill:this.skinC, alpha:0.2, tight:true, width:1.2 });
      if(this.spear && s > 0) spearHand = [hx, hy];
    }
    if(spearHand){  // cây giáo: cán gỗ dựng đứng qua tay phải + mũi sắt
      const [gx, gy] = spearHand;
      const len = this.h*0.62, hr = this.headR;
      roughStroke(ctx, [[gx, gy-len*0.80],[gx, gy+len*0.40]],
        { seed:this.seed^0x73, wobble:0.6, width:2.8, color:'#8a6a4a' });
      shape(ctx, [[gx-hr*0.10, gy-len*0.80],[gx, gy-len*0.97],[gx+hr*0.10, gy-len*0.80]],
        { seed:this.seed^0x74, fill:'#b8c4cc', alpha:0.55, tight:true, width:1.4 });
      // tua đỏ dưới mũi giáo
      roughStroke(ctx, [[gx, gy-len*0.78],[gx-hr*0.12, gy-len*0.70]],
        { seed:this.seed^0x75, wobble:0.5, width:1.6, color:'#c0392b' });
    }
    if(broomTip){  // cán chổi + đầu chổi
      const bx = broomTip[0] + 6, by = broomTip[1];
      roughStroke(ctx, [[broomTip[0]-14, by-26],[bx, by+this.legLen*0.75]], { seed:this.seed^0x71, wobble:0.7, width:2.2 });
      const br = [[bx-12, by+this.legLen*0.75],[bx+12, by+this.legLen*0.75],[bx+8, by+this.legLen*0.95],[bx-8, by+this.legLen*0.95]];
      shape(ctx, br, { seed:this.seed^0x72, fill:'#b89a5a', alpha:0.3, tight:true, width:1.4 });
    }
    if(axeInfo){  // rìu: cán + lưỡi, xoay theo vòng bổ (giơ lên -> bổ xuống)
      const L = this.armLen*1.15;
      const a = -0.6 + (1-axeInfo.lift)*3.1;   // -0.6 (giơ cao) -> 2.5 (bổ xuống)
      const dx = Math.sin(a), dy = -Math.cos(a);
      const ex = axeInfo.mx + dx*L, ey = axeInfo.my + dy*L;
      roughStroke(ctx, [[axeInfo.mx, axeInfo.my],[ex, ey]], { seed:this.seed^0x79, wobble:0.5, width:3.5 });
      const px = -dy, py = dx;  // pháp tuyến
      shape(ctx, [[ex, ey],[ex+px*18, ey+py*18],[ex+dx*26+px*18, ey+dy*26+py*18],[ex+dx*26, ey+dy*26]],
        { seed:this.seed^0x7a, fill:'#8a8f96', alpha:0.35, tight:true, width:1.5 });
    }
    if(catchRip){  // gợn sóng lan ra quanh tay vớt (giữ ngang mặt nước)
      ctx.save();
      ctx.translate(catchRip[0], catchRip[1]);
      ctx.rotate(-(sway + actLean));
      for(let i=0;i<2;i++){
        const rr = (at*1.2 + i*0.5) % 1;
        const rad = 12 + rr*26;
        roughStroke(ctx, arcPts(0, 0, rad, Math.PI*0.15, Math.PI*0.85),
          { seed:this.seed^0x7f+i, wobble:0.6, width:1.4, alpha:0.65*(1-rr*0.6) });
      }
      ctx.restore();
    }
    if(action === 'weave'){  // khung cửi trước mặt người dệt
      const lx = this.armLen*0.72;
      const topY = syA + this.armLen*0.18, botY = syA + this.armLen*0.92;
      roughStroke(ctx, [[lx-30, topY-8],[lx-30, botY+16]], { seed:this.seed^0x80, wobble:0.8, width:2.4 });
      roughStroke(ctx, [[lx+30, topY-8],[lx+30, botY+16]], { seed:this.seed^0x81, wobble:0.8, width:2.4 });
      roughStroke(ctx, [[lx-32, topY],[lx+32, topY]], { seed:this.seed^0x82, wobble:0.6, width:2.0 });
      roughStroke(ctx, [[lx-32, botY],[lx+32, botY]], { seed:this.seed^0x83, wobble:0.6, width:2.0 });
      for(let i=0;i<7;i++){  // sợi dọc
        const wx = lx - 26 + i*(52/6);
        roughStroke(ctx, [[wx, topY+2],[wx, botY-2]], { seed:this.seed^0x84+i, wobble:0.5, width:0.9, alpha:0.55 });
      }
      const wy = syA + this.armLen*0.55;  // sợi ngang theo tay đưa thoi
      roughStroke(ctx, [[lx-28, wy],[lx+28, wy]], { seed:this.seed^0x85, wobble:0.5, width:1.3, alpha:0.75 });
    }

    // head: tilt + facial overrides per action
    const _mouth = this.mouth, _brows = this.brows, _eye = this.eyeStyle;
    if(action === 'cry'){ this.mouth = 'open'; this.brows = 'sad'; }
    else if(action === 'angry'){ this.mouth = 'frown'; this.brows = 'angry'; }
    else if(action === 'sit_angry'){ this.mouth = 'frown'; this.brows = 'angry'; }
    else if(action === 'punch' || action === 'punch_hook' || action === 'kick' || action === 'kick_round'){ this.brows = 'angry'; }
    else if(action === 'block' || action === 'dodge' || action === 'fall'){ this.brows = 'sad'; }
    else if(action === 'hug' || action === 'handshake' || action === 'pat'){ this.mouth = 'smile'; }
    else if(action === 'panic'){ this.mouth = 'open'; this.eyeStyle = 'wide'; this.brows = 'sad'; }
    else if(action === 'chop'){ this.brows = 'angry'; if(chopMouth) this.mouth = 'open'; }
    else if(action === 'catch'){ this.mouth = 'flat'; }
    else if(action === 'weave'){ this.mouth = 'flat'; }
    const headCY = -(this.legLen + this.torsoH + this.neckLen + this.headR*0.82);
    ctx.save();
    ctx.translate(0, headCY + headDY);
    ctx.rotate(headTilt);
    ctx.translate(0, -(headCY + headDY));
    this.drawHead(ctx, t, blink);
    if(action === 'panic'){  // miệng há to (phủ lên miệng 'open' nhỏ)
      shape(ctx, ellipsePts(0, headCY + this.headR*0.47, this.headR*0.20, this.headR*0.27, 12),
        { seed:this.seed^0x1c, fill:'#8a5a52', alpha:0.6, tight:true, width:1.4 });
    }
    ctx.restore();
    this.mouth = _mouth; this.brows = _brows; this.eyeStyle = _eye;
    if(action === 'cry'){  // nước mắt rơi
      for(const s of [-1,1]){
        const tx = s*this.headR*0.38, ty = headCY + this.headR*0.12;
        const drop = ((t*2.2) + (s>0?0.5:0)) % 1;
        dot(ctx, tx, ty + drop*this.headR*0.55, 2.2, '#6ab0e0', 0.85*(1-drop*0.6));
      }
    }
    this.drawEmotes(ctx, t);
    this.end(ctx);
  }
}

/* arc helper: points along arc from a0 to a1 (radians), y-down space */
function arcPts(cx, cy, r, a0, a1, n=12){
  const pts = [];
  for(let i=0;i<=n;i++){
    const a = a0 + (a1-a0)*i/n;
    pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]);
  }
  return pts;
}

/* ---------------- blob monster ---------------- */
class Blob extends DoodleChar {
  constructor(seed, opts){
    super(seed, opts);
    const rng = this.rng, h = this.h;
    this.kind = 'blob';
    this.bodyR  = h * rng.range(0.34, 0.42);
    this.bodyC  = rng.pick(PALETTE.blob);
    this.ears   = rng.pick(['cat','bear','horns','antenna','none']);
    this.eyes   = rng.pick(['duo','duo','cyclops','angry','dots']);
    this.mouth  = rng.pick(['fangs','open','cat','dots','none']);
    this.freckles = rng.chance(0.55);
    this.legH   = h * 0.10;
    this.squish = rng.range(0.85, 1.15);
    // nightmare variant: dark wash, horns/spikes, X eyes, stitched mouth
    if(opts.nightmare){
      this.nightmare = true;
      this.bodyC  = rng.pick(PALETTE.nightmare);
      this.ears   = rng.pick(['horns','spikes','antenna','cat']);
      this.eyes   = rng.pick(['x','x','duo','dots']);
      this.mouth  = rng.pick(['stitched','stitched','fangs','open']);
      this.freckles = false;
    }
  }

  headTop(){ return -(this.legH + this.bodyR*2.05); }

  draw(ctx, t, depthScale){
    const pose = poseAt(this.tl, t);
    this._lookDir = pose.dir;
    const p = pose.phase;
    const hop = pose.walking ? Math.abs(Math.sin(p))*this.h*(pose.run?0.09:0.05) : 0;
    const floatY = pose.walking ? 0 : Math.sin(t*2.0+this.swayOff)*2;
    const squish = pose.walking ? Math.sin(p*2)*(pose.run?0.10:0.06) : Math.sin(t*2.3+this.swayOff)*0.03;
    const blink = this.blinking(t);
    const r = this.bodyR;
    const bodyCY = -(r + this.legH) - hop + floatY;

    scribbleShadow(ctx, pose.x, pose.y+2, r*1.15*depthScale, this.seed^0x30);

    this.begin(ctx, pose, depthScale);

    // tiny legs
    const legSwing = pose.walking ? Math.sin(p)*r*0.35 : 0;
    for(const s of [-1,1]){
      const lx = s*r*0.42 + (s<0 ? legSwing : -legSwing);
      roughStroke(ctx, [[s*r*0.42, -this.legH*1.4],[lx, 0],[lx + 4, 0]],
        { seed:this.seed+s*71, wobble:0.5, width:1.6 });
    }
    // tiny arms
    const armSw = pose.walking ? Math.sin(p)*0.4 : Math.sin(t*1.7+this.swayOff)*0.15;
    for(const s of [-1,1]){
      const sw = (s<0 ? armSw : -armSw);
      const ax = s*r*0.92, ay = bodyCY + r*0.1;
      const hx = ax + s*(r*0.30 + Math.sin(sw)*r*0.2), hy = ay + r*0.28 + Math.cos(sw)*r*0.1;
      roughStroke(ctx, [[ax, ay],[hx, hy]], { seed:this.seed+s*73, wobble:0.6, width:1.5 });
      shape(ctx, ellipsePts(hx, hy, 2.8, 2.8, 10), { seed:this.seed+s*79, fill:this.bodyC, alpha:0.25, tight:true, width:1.1 });
    }

    // body (squash & stretch around ground contact)
    ctx.save();
    ctx.translate(0, -this.legH - hop + floatY);
    ctx.scale((1+squish)*this.squish, 1-squish);
    ctx.translate(0, -(r));
    const pts = blobPts(0, 0, r, this.seed^0x31, { amp:0.07 });
    shape(ctx, pts, { seed:this.seed^0x32, fill:this.bodyC, alpha:0.24, bleed:3.2, width:1.8 });

    // ears / horns on top
    this.drawEars(ctx, r);
    // face
    this.drawFace(ctx, r, blink);
    ctx.restore();

    this.drawEmotes(ctx, t);
    this.end(ctx);
  }

  drawEars(ctx, r){
    const seed = this.seed^0x33;
    switch(this.ears){
      case 'cat':
        for(const s of [-1,1])
          shape(ctx, [[s*r*0.45, -r*0.78],[s*r*0.62, -r*1.28],[s*r*0.82, -r*0.72]],
            { seed:seed+s, fill:this.bodyC, alpha:0.2, tight:true, width:1.6 });
        break;
      case 'bear':
        for(const s of [-1,1])
          shape(ctx, ellipsePts(s*r*0.58, -r*0.88, r*0.22, r*0.22, 12),
            { seed:seed+s, fill:this.bodyC, alpha:0.2, tight:true, width:1.6 });
        break;
      case 'horns':
        for(const s of [-1,1]){
          const pts = arcPts(s*r*0.5, -r*0.5, r*0.42, -Math.PI*0.75, -Math.PI*1.25, 10);
          roughStroke(ctx, pts, { seed:seed+s, wobble:0.7, width:2.2 });
          roughStroke(ctx, pts, { seed:seed+s+5, wobble:0.7, width:1.0, alpha:0.5 });
        }
        break;
      case 'antenna': {
        const swayA = Math.sin(this.swayOff)*0.1;
        roughStroke(ctx, [[0, -r*0.95],[r*0.05, -r*1.25],[r*0.14, -r*1.4]], { seed, wobble:0.6, width:1.4 });
        shape(ctx, ellipsePts(r*0.15, -r*1.44, r*0.07, r*0.07, 10), { seed:seed+1, fill:this.bodyC, alpha:0.3, tight:true, width:1.2 });
        break;
      }
      case 'spikes': {
        const pts = [];
        for(let i=0;i<=6;i++){
          const x = -r*0.7 + i/6*r*1.4;
          pts.push([x, -r*0.70]);
          if(i<6) pts.push([x + r*0.12, -r*(0.95 + (i%2)*0.2)]);
        }
        shape(ctx, pts, { seed, fill:this.bodyC, alpha:0.28, tight:true, width:1.5 });
        break;
      }
      default: break;
    }
  }

  drawFace(ctx, r, blink){
    const seed = this.seed^0x34;
    const look = this._lookDir ?? 1;
    const eyeY = -r*0.18;
    // eyes
    if(this.eyes === 'cyclops'){
      const er = r*0.24;
      if(blink){
        roughStroke(ctx, [[-er, eyeY],[er, eyeY]], { seed, wobble:0.4, width:1.5 });
      } else {
        shape(ctx, ellipsePts(0, eyeY, er, er*1.05, 16), { seed, fill:'#fdfbf5', alpha:0.4, bleed:1, tight:true, width:1.5 });
        dot(ctx, look*er*0.25, eyeY+er*0.08, er*0.42, PENCIL, 0.9);
      }
    } else {
      const dx = this.eyes === 'duo' ? r*0.36 : r*0.34;
      for(const s of [-1,1]){
        const ex = s*dx;
        if(blink){
          roughStroke(ctx, [[ex-r*0.14, eyeY],[ex+r*0.14, eyeY]], { seed:seed+s, wobble:0.4, width:1.5 });
        } else if(this.eyes === 'x'){
          const c = this.nightmare ? '#e8e4d8' : PENCIL;
          roughStroke(ctx, [[ex-r*0.13, eyeY-r*0.13],[ex+r*0.13, eyeY+r*0.13]], { seed:seed+s, wobble:0.4, width:1.8, color:c });
          roughStroke(ctx, [[ex-r*0.13, eyeY+r*0.13],[ex+r*0.13, eyeY-r*0.13]], { seed:seed+s+9, wobble:0.4, width:1.8, color:c });
        } else if(this.eyes === 'dots'){
          dot(ctx, ex, eyeY, r*0.06, PENCIL, 0.85);
        } else {
          const er = r*0.185;
          shape(ctx, ellipsePts(ex, eyeY, er, er*1.06, 14), { seed:seed+s, fill:'#fdfbf5', alpha:0.4, bleed:1, tight:true, width:1.5 });
          dot(ctx, ex + look*er*0.25, eyeY+er*0.08, er*0.4, PENCIL, 0.9);
          if(this.eyes === 'angry'){
            const tilt = -s*r*0.12;
            roughStroke(ctx, [[ex-er*1.2, eyeY-er*1.5-tilt],[ex+er*1.2, eyeY-er*1.5+tilt]],
              { seed:seed+s*3, wobble:0.4, width:1.8 });
          }
        }
      }
    }
    // mouth
    const my = r*0.30;
    if(this.mouth === 'fangs'){
      roughStroke(ctx, arcPts(0, my-r*0.12, r*0.4, 0.35, Math.PI-0.35), { seed:seed+11, wobble:0.5, width:1.5 });
      // fang triangles hanging from the arc
      for(const s of [-1,1])
        shape(ctx, [[s*r*0.30, my+r*0.02],[s*r*0.24, my+r*0.20],[s*r*0.16, my+r*0.03]],
          { seed:seed+12+s, fill:'#fdfbf5', alpha:0.5, tight:true, width:1.2 });
    } else if(this.mouth === 'open'){
      shape(ctx, ellipsePts(0, my+r*0.02, r*0.14, r*0.17, 12), { seed:seed+11, fill:'#8a5a52', alpha:0.55, tight:true, width:1.3 });
    } else if(this.mouth === 'cat'){
      roughStroke(ctx, arcPts(-r*0.13, my-r*0.05, r*0.14, 0.2, Math.PI-0.2), { seed:seed+11, wobble:0.4, width:1.4 });
      roughStroke(ctx, arcPts( r*0.13, my-r*0.05, r*0.14, 0.2, Math.PI-0.2), { seed:seed+12, wobble:0.4, width:1.4 });
    } else if(this.mouth === 'stitched'){
      const c = this.nightmare ? '#e8e4d8' : PENCIL;
      roughStroke(ctx, [[-r*0.3, my],[r*0.3, my]], { seed:seed+11, wobble:0.5, width:1.6, color:c });
      for(const mx of [-r*0.18, 0, r*0.18])
        roughStroke(ctx, [[mx, my-r*0.08],[mx, my+r*0.08]], { seed:seed+12+Math.round(mx*10), wobble:0.3, width:1.3, color:c });
    } else if(this.mouth === 'dots'){
      const fr = new RNG(seed+13);
      for(let i=0;i<4;i++) dot(ctx, (fr.next()-0.5)*r*0.7, my+(fr.next()-0.5)*r*0.15, 1.2, PENCIL, 0.5);
    }
    // freckles
    if(this.freckles){
      const fr = new RNG(seed+21);
      for(let i=0;i<7;i++){
        const a = fr.next()*Math.PI*2, d = fr.next()*r*0.7;
        dot(ctx, Math.cos(a)*d, Math.sin(a)*d*0.8 + r*0.15, 1.2, PENCIL, 0.35);
      }
    }
  }
}

/* ---------------- ghost ---------------- */
class Ghost extends DoodleChar {
  constructor(seed, opts){
    super(seed, opts);
    const rng = this.rng, h = this.h;
    this.kind = 'ghost';
    this.bodyW = h * rng.range(0.30, 0.36);
    this.bodyH = h * rng.range(0.55, 0.65);
    this.waves = rng.int(3, 5);
    this.arms  = rng.chance(0.5);
    this.mouth = rng.pick(['o','smile','dots','flat']);
    this.bodyC = PALETTE.ghost;
    this.tint  = rng.pick(['#f6f2e8','#f2eee2','#efe9f2','#e9f0ee']);
  }

  headTop(){ return -(this.bodyH + this.bodyW*0.55); }

  bodyPath(wavePhase){
    const w = this.bodyW, h = this.bodyH;
    const pts = [];
    const top = -h;
    // dome top (arc through the top point, bulging up)
    const dome = arcPts(0, top + w*0.55, w*0.98, Math.PI, Math.PI*2, 12);
    for(const p of dome) pts.push([p[0], p[1]]);
    // right side down
    pts.push([w, -h*0.18]);
    // wavy bottom right->left
    const n = this.waves;
    for(let i=0;i<=n*4;i++){
      const u = i/(n*4);
      const x = w - u*2*w;
      const y = -h*0.06 + Math.sin(u*n*Math.PI*2 + wavePhase)*h*0.05 - Math.abs(Math.sin(u*n*Math.PI + wavePhase))*h*0.06;
      pts.push([x, y]);
    }
    // left side up
    pts.push([-w, -h*0.18]);
    return pts;
  }

  draw(ctx, t, depthScale){
    const pose = poseAt(this.tl, t);
    this._lookDir = pose.dir;
    const floatY = Math.sin(t*1.7+this.swayOff)*4 - 6;
    const tilt = pose.walking ? Math.sin(pose.phase)*(pose.run?0.12:0.05) : Math.sin(t*1.2+this.swayOff)*0.04;
    const blink = this.blinking(t);
    const wavePh = t*3 + this.swayOff;

    scribbleShadow(ctx, pose.x, pose.y+2, this.bodyW*0.95*depthScale, this.seed^0x40);

    this.begin(ctx, pose, depthScale);
    ctx.translate(0, floatY);
    ctx.rotate(tilt);

    const pts = this.bodyPath(wavePh);
    shape(ctx, pts, { seed:this.seed^0x41, fill:this.tint, alpha:0.26, bleed:2.8, width:1.7 });

    // little nub arms
    if(this.arms){
      for(const s of [-1,1])
        shape(ctx, ellipsePts(s*this.bodyW*1.02, -this.bodyH*0.42, this.bodyW*0.13, this.bodyW*0.10, 10),
          { seed:this.seed+s*83, fill:this.tint, alpha:0.25, tight:true, width:1.2 });
    }

    // eyes
    const eyeY = -this.bodyH*0.62, dx = this.bodyW*0.34;
    const look = this._lookDir ?? 1;
    for(const s of [-1,1]){
      const ex = s*dx;
      if(blink)
        roughStroke(ctx, [[ex-4, eyeY],[ex+4, eyeY]], { seed:this.seed+s*89, wobble:0.3, width:1.4 });
      else{
        shape(ctx, ellipsePts(ex, eyeY, 4.6, 6.0, 12), { seed:this.seed+s*89, fill:'#fdfbf5', alpha:0.3, tight:true, width:1.3 });
        dot(ctx, ex + look*1.4, eyeY+1, 2.2, PENCIL, 0.9);
      }
    }
    // mouth
    const my = -this.bodyH*0.44;
    if(this.mouth === 'o')
      shape(ctx, ellipsePts(0, my, 4.2, 5.2, 12), { seed:this.seed^0x42, fill:'#8a5a52', alpha:0.5, tight:true, width:1.2 });
    else if(this.mouth === 'smile')
      roughStroke(ctx, arcPts(0, my-2, 7, 0.3, Math.PI-0.3), { seed:this.seed^0x42, wobble:0.4, width:1.3 });
    else if(this.mouth === 'flat')
      roughStroke(ctx, [[-5, my],[5, my]], { seed:this.seed^0x42, wobble:0.3, width:1.3 });
    else{
      dot(ctx, -4, my, 1.1, PENCIL, 0.5); dot(ctx, 0, my+1.5, 1.1, PENCIL, 0.5); dot(ctx, 4, my, 1.1, PENCIL, 0.5);
    }

    this.drawEmotes(ctx, t);
    this.end(ctx);
  }
}

/* ---------------- pet (cat / dog) ----------------
 * Quadruped, faces +x before dir flip. Seeded variety:
 * ears (pointy/floppy/round/pigtails), coat, pattern
 * (eyePatch/mask/backSpot), tail (long/curled/wag/stub), collar. */
class Pet extends DoodleChar {
  constructor(seed, opts){
    super(seed, opts);
    const rng = this.rng, h = this.h;
    this.kind = opts.petKind ?? 'cat';
    this.legH  = h * rng.range(0.30, 0.36);
    this.bodyL = h * rng.range(0.52, 0.62);   // body half-length
    this.bodyR = h * rng.range(0.22, 0.27);   // body half-height
    this.headR = h * rng.range(0.20, 0.25);
    this.coat  = rng.pick(PALETTE.pet);
    this.markC = rng.pick(PALETTE.petMark);
    this.ears  = this.kind === 'cat'
      ? rng.pick(['pointy','pointy','round','pigtails'])
      : rng.pick(['floppy','floppy','pointy','pigtails']);
    this.pattern = rng.pick(['none','none','eyePatch','mask','backSpot']);
    this.tail  = this.kind === 'cat' ? rng.pick(['long','long','curled'])
                                     : rng.pick(['wag','wag','stub','curled']);
    this.collar  = rng.chance(this.kind === 'dog' ? 0.45 : 0.18);
    this.tongue  = this.kind === 'dog' && rng.chance(0.35);
    this.eyeStyle = rng.pick(['open','open','dots','calm']);
    this.snout    = this.kind === 'dog' ? rng.range(0.9, 1.2) : rng.range(0.55, 0.8);
    this.tailRate = this.kind === 'dog' ? rng.range(4.5, 6) : rng.range(1.4, 2.2);
  }
  headTop(){ return -(this.legH + this.bodyR*1.4 + this.headR*1.9); }

  drawTail(ctx, t, bodyCY){
    const s = this.seed, bx = -this.bodyL*0.95, by = bodyCY - this.bodyR*0.3;
    const wag = Math.sin(t*this.tailRate + this.swayOff);
    if(this.tail === 'long'){
      const tipX = bx - this.bodyL*0.35;
      roughStroke(ctx, [[bx, by],[tipX, by - this.bodyR*1.3],[tipX + this.bodyL*0.15, by - this.bodyR*2.1 + wag*6]],
        { seed:s^0x70, wobble:0.8, width:2.0 });
    } else if(this.tail === 'curled'){
      const pts = arcPts(bx - this.bodyL*0.18, by - this.bodyR*1.0, this.bodyR*0.85, 0.4, Math.PI*1.9, 12)
        .concat(arcPts(bx - this.bodyL*0.18, by - this.bodyR*1.0, this.bodyR*0.45, Math.PI*1.9, Math.PI*0.9, 8));
      roughStroke(ctx, pts, { seed:s^0x70, wobble:0.7, width:2.0 });
    } else if(this.tail === 'wag'){
      const a = -Math.PI*0.35 + wag*0.35;
      roughStroke(ctx, [[bx, by],[bx + Math.cos(a)*this.bodyL*0.42, by + Math.sin(a)*this.bodyL*0.42]],
        { seed:s^0x70, wobble:0.8, width:2.4 });
    } else {
      roughStroke(ctx, [[bx, by],[bx - this.bodyL*0.14, by - this.bodyR*0.5 + wag*2]], { seed:s^0x70, wobble:0.6, width:2.6 });
    }
  }

  drawHead(ctx, t, hx, hy, blink){
    const r = this.headR, s = this.seed;
    ctx.save(); ctx.translate(hx, hy);
    // ears behind the head blob
    const es = s^0x65;
    if(this.ears === 'pointy'){
      shape(ctx, [[-r*0.55,-r*0.55],[-r*0.42,-r*1.35],[-r*0.05,-r*0.75]], { seed:es, fill:this.coat, alpha:0.22, tight:true, width:1.6 });
      shape(ctx, [[r*0.15,-r*0.72],[r*0.55,-r*1.3],[r*0.7,-r*0.5]], { seed:es+1, fill:this.coat, alpha:0.22, tight:true, width:1.6 });
    } else if(this.ears === 'floppy'){
      shape(ctx, blobPts(-r*0.62, -r*0.1, r*0.42, es, { amp:0.07, sqX:0.5, sqY:1.5 }), { seed:es+2, fill:this.coat, alpha:0.25, tight:true, width:1.5 });
      shape(ctx, blobPts(r*0.72, -r*0.15, r*0.4, es+3, { amp:0.07, sqX:0.5, sqY:1.45 }), { seed:es+4, fill:this.coat, alpha:0.25, tight:true, width:1.5 });
    } else if(this.ears === 'round'){
      for(const sd of [-1,1])
        shape(ctx, ellipsePts(sd*r*0.5, -r*0.72, r*0.22, r*0.2, 12), { seed:es+sd, fill:this.coat, alpha:0.22, tight:true, width:1.5 });
    } else { // pigtails on stalks, swaying
      for(const sd of [-1,1]){
        const sway = Math.sin(t*2+this.swayOff+sd)*r*0.05;
        roughStroke(ctx, [[sd*r*0.5, -r*0.5],[sd*r*0.95, -r*1.0+sway]], { seed:es+sd*3, wobble:0.5, width:1.5 });
        shape(ctx, blobPts(sd*r*1.0, -r*1.1+sway, r*0.28, es+sd*5, { amp:0.1 }), { seed:es+sd*7, fill:this.coat, alpha:0.25, tight:true, width:1.5 });
      }
    }
    // head
    shape(ctx, blobPts(0, 0, r, s^0x66, { amp:0.05, sqY:0.9 }), { seed:s^0x67, fill:this.coat, alpha:0.25, bleed:2.2, width:1.7 });
    // snout + nose
    const sn = this.snout;
    shape(ctx, blobPts(r*0.75, r*0.18, r*0.38*sn, s^0x68, { amp:0.06, sqX:1.1, sqY:0.75 }),
      { seed:s^0x69, fill:this.coat, alpha:0.25, tight:true, width:1.4 });
    dot(ctx, r*(0.75+0.34*sn), r*0.12, r*0.09, PENCIL, 0.9);
    // markings
    if(this.pattern === 'mask')
      shape(ctx, blobPts(r*0.1, -r*0.1, r*0.75, s^0x6a, { amp:0.08, sqX:1.2, sqY:0.5 }), { seed:s^0x6b, fill:this.markC, alpha:0.3, tight:true, width:1.1 });
    else if(this.pattern === 'eyePatch')
      shape(ctx, blobPts(r*0.32, -r*0.15, r*0.32, s^0x6a, { amp:0.1 }), { seed:s^0x6b, fill:this.markC, alpha:0.35, tight:true, width:1.1 });
    // eyes
    const eyeY = -r*0.15;
    for(const ex of [-r*0.34, r*0.38]){
      const k = Math.round(ex*10);
      if(blink) roughStroke(ctx, [[ex-r*0.14, eyeY],[ex+r*0.14, eyeY]], { seed:s+k, wobble:0.4, width:1.4 });
      else if(this.eyeStyle === 'dots') dot(ctx, ex, eyeY, r*0.07, PENCIL, 0.85);
      else {
        const er = r*0.16;
        shape(ctx, ellipsePts(ex, eyeY, er, er*1.1, 12), { seed:s+k, fill:'#fdfbf5', alpha:0.4, tight:true, width:1.3 });
        dot(ctx, ex+er*0.25, eyeY+er*0.1, er*0.4, PENCIL, 0.9);
        if(this.eyeStyle === 'calm')
          roughStroke(ctx, [[ex-er, eyeY-er],[ex+er, eyeY-er]], { seed:s+k+1, wobble:0.4, width:1.2, alpha:0.6 });
      }
    }
    // mouth: ω for cats, smile (+tongue) for dogs
    if(this.kind === 'cat'){
      roughStroke(ctx, arcPts(r*0.55, r*0.32, r*0.12, 0.2, Math.PI-0.2, 8), { seed:s^0x6c, wobble:0.3, width:1.3 });
      roughStroke(ctx, arcPts(r*0.79, r*0.32, r*0.12, 0.2, Math.PI-0.2, 8), { seed:s^0x6d, wobble:0.3, width:1.3 });
      for(const wy of [r*0.05, r*0.2])
        roughStroke(ctx, [[r*0.55, wy],[r*1.15, wy-r*0.1]], { seed:s+Math.round(wy*100), wobble:0.3, width:0.9, alpha:0.6 });
    } else {
      roughStroke(ctx, arcPts(r*0.45, r*0.3, r*0.3, 0.25, Math.PI-0.45, 8), { seed:s^0x6c, wobble:0.4, width:1.4 });
      if(this.tongue)
        shape(ctx, blobPts(r*0.62, r*0.55, r*0.14, s^0x6e, { amp:0.1, sqY:1.4 }), { seed:s^0x6f, fill:'#e8a0a0', alpha:0.5, tight:true, width:1.1 });
    }
    ctx.restore();
  }

  draw(ctx, t, depthScale){
    const pose = poseAt(this.tl, t);
    this._lookDir = pose.dir;
    const p = pose.phase;
    const walkAmt = pose.walking ? 1 : 0;
    const bob = pose.walking ? -Math.abs(Math.sin(p))*this.h*0.025 : Math.sin(t*1.6+this.swayOff)*1.1;
    const blink = this.blinking(t);
    const legH = this.legH, bodyCY = -(legH + this.bodyR*0.9);
    const headX = this.bodyL*0.92, headY = bodyCY - this.headR*0.9;

    scribbleShadow(ctx, pose.x, pose.y+2, this.bodyL*1.2*depthScale, this.seed^0x60);
    this.begin(ctx, pose, depthScale);
    ctx.translate(0, bob);

    this.drawTail(ctx, t, bodyCY);

    // legs — diagonal pairs trot
    [-this.bodyL*0.55, -this.bodyL*0.25, this.bodyL*0.25, this.bodyL*0.55].forEach((lx, i)=>{
      const ph = p + ((i===0||i===3) ? 0 : Math.PI);
      const sw = walkAmt ? Math.sin(ph)*legH*0.42 : 0;
      const lift = walkAmt ? Math.max(0, Math.cos(ph))*legH*0.18 : 0;
      roughStroke(ctx, [[lx, bodyCY],[lx+sw*0.4, -legH*0.45],[lx+sw, -lift]], { seed:this.seed+i*7, wobble:0.7, width:1.7 });
    });

    // body + back spot
    shape(ctx, blobPts(0, bodyCY, this.bodyR, this.seed^0x61, { amp:0.06, sqX:this.bodyL/this.bodyR }),
      { seed:this.seed^0x62, fill:this.coat, alpha:0.22, bleed:2.6, width:1.7 });
    if(this.pattern === 'backSpot')
      shape(ctx, blobPts(-this.bodyL*0.3, bodyCY - this.bodyR*0.25, this.bodyR*0.55, this.seed^0x63, { amp:0.1, sqX:1.4, sqY:0.8 }),
        { seed:this.seed^0x64, fill:this.markC, alpha:0.3, tight:true, width:1.2 });

    // collar + bell
    if(this.collar){
      const nx = headX - this.headR*0.55, ny = headY + this.headR*0.85;
      roughStroke(ctx, [[nx-2, ny-6],[nx-8, ny+10]], { seed:this.seed^0x77, wobble:0.4, width:3, color:'#c87a6a' });
      dot(ctx, nx-8, ny+12, 2.4, '#d8b25a', 0.9);
    }

    this.drawHead(ctx, t, headX, headY, blink);
    this.drawEmotes(ctx, t);
    this.end(ctx);
  }
}

/* ---------------- animal (Tấm Cám) ----------------
 * Động vật truyện Tấm Cám, phong cách doodle vẽ tay + watercolor.
 *   petKind: 'cabong' (cá bống) | 'trau' (trâu) | 'nguahong' (ngựa hồng)
 *            'qua' (quạ) | 'buom' (bướm) | 'se' (chim sẻ)
 * Actions (qua moves {m}): 'swim' 'surface' (cá) · 'graze' (trâu) ·
 *   'rear' (ngựa hí) · 'fly' 'perch' (quạ, sẻ) · 'flutter' (bướm)
 * Dùng trong render-story: { "kind": "pet", "petKind": "trau", "h": 260, ... }
 */
class Animal extends DoodleChar {
  constructor(seed, opts){
    super(seed, opts);
    const rng = this.rng, h = this.h;
    this.kind = opts.petKind ?? 'cabong';
    this.eyeStyle = rng.pick(['open','open','dots','calm']);
    const K = this.kind;
    if(K === 'cabong'){            // cá bống vàng nâu
      this.bodyC = '#c8983a'; this.finC = '#a87828'; this.bellyC = '#e8d090';
      this.bodyL = h*0.42; this.bodyR = h*0.20;
    } else if(K === 'trau'){       // trâu đen to lớn
      this.bodyC = '#3a3a3e'; this.bellyC = '#55555c'; this.hornC = '#d8cba8';
      this.bodyL = h*0.44; this.bodyR = h*0.26; this.legH = h*0.30; this.headR = h*0.17;
    } else if(K === 'nguahong'){   // ngựa hồng, bờm bay
      this.bodyC = '#e89ab0'; this.maneC = '#c06a8a'; this.saddleC = '#8a5a3a';
      this.bodyL = h*0.42; this.bodyR = h*0.24; this.legH = h*0.34; this.headR = h*0.16;
    } else if(K === 'qua'){        // quạ đen
      this.bodyC = '#1c1c20'; this.beakC = '#e8a83a';
      this.bodyL = h*0.34; this.bodyR = h*0.22; this.legH = h*0.22; this.headR = h*0.17;
    } else if(K === 'buom'){       // bướm màu sắc
      this.wingC = rng.pick(['#e88aa0','#8ab0e8','#a0d88a','#e8c83a','#b08ae8']);
      this.spotC = '#fdfbf5'; this.bodyC = '#5a4a3a';
      this.wingL = h*0.30; this.wingW = h*0.22;
    } else {                       // 'se' — chim sẻ nâu nhỏ
      this.bodyC = '#8a6a4a'; this.bellyC = '#c8a878'; this.beakC = '#5a4a3a';
      this.bodyL = h*0.30; this.bodyR = h*0.20; this.legH = h*0.20; this.headR = h*0.16;
    }
    this.tailRate = rng.range(4, 7);
  }

  headTop(){ return -this.h*0.85; }

  finish(ctx, t){
    this.drawEmotes(ctx, t);
    this.end(ctx);
  }

  draw(ctx, t, depthScale){
    const pose = poseAt(this.tl, t);
    this._lookDir = pose.dir;
    const K = this.kind;
    if(K === 'cabong') this.drawFish(ctx, t, pose, depthScale);
    else if(K === 'trau') this.drawBuffalo(ctx, t, pose, depthScale);
    else if(K === 'nguahong') this.drawHorse(ctx, t, pose, depthScale);
    else if(K === 'qua') this.drawCrow(ctx, t, pose, depthScale);
    else if(K === 'buom') this.drawButterfly(ctx, t, pose, depthScale);
    else this.drawSparrow(ctx, t, pose, depthScale);
  }

  // ---- cá bống: thân oval, đuôi quạt, vây; bơi (đuôi quẫy), ngoi lên mặt nước ----
  drawFish(ctx, t, pose, depthScale){
    const s = this.seed, h = this.h;
    const surfacing = pose.action === 'surface';
    const bobY = surfacing ? -h*0.16 + Math.sin(t*5)*h*0.015
                           : Math.sin(t*2.2 + this.swayOff)*h*0.03;
    scribbleShadow(ctx, pose.x, pose.y+2, this.bodyL*1.1*depthScale, s^0xa0);
    this.begin(ctx, pose, depthScale);
    ctx.translate(0, -h*0.42 + bobY);
    ctx.rotate(Math.sin(t*1.6 + this.swayOff)*0.07);
    const wag = Math.sin(t*(surfacing ? 11 : 8) + this.swayOff);   // đuôi quẫy
    const bx = -this.bodyL;
    // đuôi quạt
    const tx = bx - this.bodyL*0.42, ty = wag*this.bodyR*0.55;
    shape(ctx, [[bx, -this.bodyR*0.42],[tx, ty-this.bodyR*0.55],[tx, ty+this.bodyR*0.55],[bx, this.bodyR*0.42]],
      { seed:s^0xa1, fill:this.finC, alpha:0.35, tight:true, width:1.6 });
    // vây lưng
    shape(ctx, [[-this.bodyL*0.1, -this.bodyR*0.9],[this.bodyL*0.25, -this.bodyR*1.25],[this.bodyL*0.4, -this.bodyR*0.85]],
      { seed:s^0xa2, fill:this.finC, alpha:0.32, tight:true, width:1.4 });
    // thân oval
    shape(ctx, blobPts(0, 0, this.bodyR, s^0xa3, { amp:0.06, sqX:this.bodyL/this.bodyR, sqY:1 }),
      { seed:s^0xa4, fill:this.bodyC, alpha:0.3, bleed:2.4, width:1.7 });
    // bụng sáng
    shape(ctx, blobPts(this.bodyL*0.1, this.bodyR*0.35, this.bodyR*0.7, s^0xa5, { amp:0.08, sqX:1.3, sqY:0.6 }),
      { seed:s^0xa6, fill:this.bellyC, alpha:0.3, tight:true, width:1.2 });
    // vẩy
    for(let i=0;i<3;i++){
      const vx = -this.bodyL*0.5 + i*this.bodyL*0.35;
      roughStroke(ctx, arcPts(vx, 0, this.bodyR*0.5, Math.PI*0.7, Math.PI*1.3, 8),
        { seed:s+i, wobble:0.4, width:1.1, alpha:0.55 });
    }
    // mắt
    const ex = this.bodyL*0.62, ey = -this.bodyR*0.25;
    shape(ctx, ellipsePts(ex, ey, this.bodyR*0.16, this.bodyR*0.18, 10),
      { seed:s^0xa8, fill:'#fdfbf5', alpha:0.5, tight:true, width:1.2 });
    dot(ctx, ex+this.bodyR*0.05, ey, this.bodyR*0.07, PENCIL, 0.9);
    // miệng
    if(surfacing)
      shape(ctx, ellipsePts(this.bodyL*0.92, this.bodyR*0.15, this.bodyR*0.12, this.bodyR*0.14, 10),
        { seed:s^0xa9, fill:'#8a5a52', alpha:0.55, tight:true, width:1.2 });
    else
      roughStroke(ctx, arcPts(this.bodyL*0.82, this.bodyR*0.1, this.bodyR*0.16, 0.4, Math.PI-0.9, 8),
        { seed:s^0xa9, wobble:0.3, width:1.3 });
    // gợn sóng khi ngoi lên
    if(surfacing){
      for(let i=0;i<2;i++){
        const rw = (t*1.4 + i*0.5) % 1;
        roughStroke(ctx, arcPts(this.bodyL*0.92, -this.bodyR*0.1, this.bodyR*(0.6+rw*1.2), Math.PI*1.15, Math.PI*1.85, 10),
          { seed:s^0xaa+i, wobble:0.4, width:1.2, alpha:0.6*(1-rw) });
      }
    }
    this.finish(ctx, t);
  }

  // ---- trâu: thân to, 4 chân, sừng cong, tai, đuôi; đi chậm, vẫy đuôi, gặm cỏ ----
  drawBuffalo(ctx, t, pose, depthScale){
    const s = this.seed, h = this.h;
    const p = pose.phase;
    const walkAmt = pose.walking ? 1 : 0;
    const grazing = pose.action === 'graze';
    const legH = this.legH, bodyCY = -(legH + this.bodyR*0.85);
    const bob = pose.walking ? -Math.abs(Math.sin(p))*h*0.02 : Math.sin(t*1.4+this.swayOff)*1.0;
    scribbleShadow(ctx, pose.x, pose.y+2, this.bodyL*1.25*depthScale, s^0xb0);
    this.begin(ctx, pose, depthScale);
    ctx.translate(0, bob);
    // đuôi vẫy
    const wag = Math.sin(t*this.tailRate*0.5 + this.swayOff);
    const tx0 = -this.bodyL*0.98, ty0 = bodyCY - this.bodyR*0.2;
    roughStroke(ctx, [[tx0, ty0],[tx0 - this.bodyL*0.1, ty0 + this.legH*0.4],[tx0 - this.bodyL*0.08 + wag*8, ty0 + this.legH*0.75]],
      { seed:s^0xb1, wobble:0.7, width:2.0 });
    dot(ctx, tx0 - this.bodyL*0.08 + wag*8, ty0 + this.legH*0.75, 3.2, this.bodyC, 0.8);
    // 4 chân
    const stride = this.legH*0.4*walkAmt;
    [-0.62, -0.28, 0.28, 0.62].forEach((lxk, i)=>{
      const lx = lxk*this.bodyL;
      const ph = p + (i%2 ? Math.PI : 0);
      const fx = Math.sin(ph)*stride, fy = -Math.max(0, Math.cos(ph))*this.legH*0.14*walkAmt;
      roughStroke(ctx, [[lx, bodyCY],[lx+fx*0.5, -legH*0.5],[lx+fx, fy]], { seed:s+i*7, wobble:0.7, width:2.2 });
      roughStroke(ctx, [[lx+fx-4, fy],[lx+fx+4, fy]], { seed:s+i*7+1, wobble:0.3, width:2.6 }); // móng
    });
    // thân to
    shape(ctx, blobPts(0, bodyCY, this.bodyR, s^0xb2, { amp:0.05, sqX:this.bodyL/this.bodyR, sqY:1.02 }),
      { seed:s^0xb3, fill:this.bodyC, alpha:0.28, bleed:2.8, width:1.8 });
    // cổ + đầu (gặm cỏ: cúi xuống)
    const hx = this.bodyL*0.95;
    const hy = grazing ? bodyCY + this.legH*0.55 + this.headR*1.4
                       : bodyCY - this.headR*0.7 + Math.sin(t*1.2)*2;
    roughStroke(ctx, [[this.bodyL*0.72, bodyCY - this.bodyR*0.4],[hx - this.headR*0.4, hy]],
      { seed:s^0xb4, wobble:0.8, width:3.2 });
    this.drawBuffaloHead(ctx, t, hx, hy, grazing);
    this.finish(ctx, t);
  }

  drawBuffaloHead(ctx, t, hx, hy, grazing){
    const s = this.seed, r = this.headR;
    ctx.save(); ctx.translate(hx, hy);
    // sừng cong
    for(const sd of [-1, 1]){
      const sway = Math.sin(t*1.5 + this.swayOff + sd)*r*0.03;
      roughStroke(ctx, [[sd*r*0.5, -r*0.75],[sd*r*1.15, -r*1.25 + sway],[sd*r*1.7, -r*0.85 + sway]],
        { seed:s^0xb5 + sd, wobble:0.7, width:2.6, color:this.hornC });
    }
    // tai
    for(const sd of [-1, 1])
      shape(ctx, [[sd*r*0.75, -r*0.3],[sd*r*1.25, -r*0.1 + Math.sin(t*2+sd)*r*0.06],[sd*r*0.8, r*0.05]],
        { seed:s^0xb6 + sd, fill:this.bodyC, alpha:0.25, tight:true, width:1.4 });
    // đầu
    shape(ctx, blobPts(0, 0, r, s^0xb7, { amp:0.06, sqY:1.05 }),
      { seed:s^0xb8, fill:this.bodyC, alpha:0.25, bleed:2.2, width:1.7 });
    // mõm + lỗ mũi
    shape(ctx, blobPts(r*0.15, r*0.55, r*0.55, s^0xb9, { amp:0.07, sqX:1.15, sqY:0.7 }),
      { seed:s^0xba, fill:this.bellyC, alpha:0.3, tight:true, width:1.3 });
    dot(ctx, -r*0.1, r*0.62, r*0.07, PENCIL, 0.8);
    dot(ctx, r*0.35, r*0.6, r*0.07, PENCIL, 0.8);
    if(grazing){
      const ch = Math.abs(Math.sin(t*6))*r*0.08;   // miệng nhai
      roughStroke(ctx, [[-r*0.3, r*0.85],[0, r*0.85+ch],[r*0.4, r*0.8]],
        { seed:s^0xbb, wobble:0.4, width:1.4 });
      roughStroke(ctx, [[-r*0.2, r*0.95],[-r*0.35, r*1.3]], { seed:s^0xbc, wobble:0.5, width:1.6, color:'#5a8a3a' });
      roughStroke(ctx, [[r*0.1, r*0.95],[r*0.05, r*1.32]], { seed:s^0xbd, wobble:0.5, width:1.6, color:'#5a8a3a' });
    }
    // mắt
    const blink = this.blinking(t);
    for(const ex of [-r*0.42, r*0.3]){
      if(blink)
        roughStroke(ctx, [[ex-r*0.12, -r*0.15],[ex+r*0.12, -r*0.15]], { seed:s+Math.round(ex*10), wobble:0.4, width:1.3 });
      else {
        shape(ctx, ellipsePts(ex, -r*0.15, r*0.13, r*0.15, 10),
          { seed:s+Math.round(ex*10), fill:'#fdfbf5', alpha:0.45, tight:true, width:1.2 });
        dot(ctx, ex+r*0.04, -r*0.13, r*0.055, PENCIL, 0.9);
      }
    }
    ctx.restore();
  }

  // ---- ngựa hồng: thân, 4 chân, bờm bay, đuôi, yên; đi / phi (run) / hí (rear) ----
  drawHorse(ctx, t, pose, depthScale){
    const s = this.seed, h = this.h;
    const p = pose.phase;
    const walkAmt = pose.walking ? 1 : 0;
    const gallop = !!pose.run;
    const rearing = pose.action === 'rear';
    const legH = this.legH, bodyCY = -(legH + this.bodyR*0.85);
    const bob = pose.walking ? -Math.abs(Math.sin(p))*h*(gallop?0.035:0.02) : Math.sin(t*1.6+this.swayOff)*1.1;
    scribbleShadow(ctx, pose.x, pose.y+2, this.bodyL*1.2*depthScale, s^0xc0);
    this.begin(ctx, pose, depthScale);
    ctx.translate(0, bob + (rearing ? -this.legH*0.55 : 0));
    if(rearing) ctx.rotate(-0.5);   // chồm lên
    // đuôi bay
    const flow = Math.sin(t*3 + this.swayOff);
    for(let i=0;i<3;i++)
      roughStroke(ctx, [[-this.bodyL*0.95, bodyCY-this.bodyR*0.3],
        [-this.bodyL*1.25 - i*4, bodyCY+this.legH*0.25 + flow*6],
        [-this.bodyL*1.15 - i*7, bodyCY+this.legH*0.6 + flow*10]],
        { seed:s^0xc1+i, wobble:0.9, width:2.2, color:this.maneC });
    // 4 chân
    const stride = this.legH*(gallop?0.75:0.42)*walkAmt;
    const liftH = this.legH*(gallop?0.3:0.16);
    [-0.62, -0.28, 0.28, 0.62].forEach((lxk, i)=>{
      const lx = lxk*this.bodyL;
      const ph = p + ((i===0||i===3) ? 0 : Math.PI);
      let fx = Math.sin(ph)*stride, fy = -Math.max(0, Math.cos(ph))*liftH*walkAmt;
      if(rearing && i>=2){ fx = this.legH*0.5; fy = -this.legH*0.55; }  // 2 chân trước giơ
      roughStroke(ctx, [[lx, bodyCY],[lx+fx*0.4, -legH*0.5],[lx+fx, fy]], { seed:s+i*7, wobble:0.7, width:2.0 });
